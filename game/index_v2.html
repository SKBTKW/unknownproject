<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial of the Ages: Last Ember (v2 Unity-Ready Testbed)</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1115;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .header-panel {
            background: #1a1d24;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #2a2e39;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .resource-badge {
            display: inline-block;
            margin-right: 15px;
            font-weight: bold;
            font-size: 1.1em;
        }
        .main-container {
            display: flex;
            gap: 20px;
        }
        .board-container {
            background: #15181e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2a2e39;
        }
        .grid-board {
            display: grid;
            gap: 4px;
            background: #090a0c;
            padding: 8px;
            border-radius: 6px;
        }
        .cell {
            width: 48px;
            height: 48px;
            background: #1f232d;
            border: 1px solid #2d3241;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
            position: relative;
            user-select: none;
        }
        .cell:hover {
            border-color: #4a90e2;
        }
        .cell.hq {
            background: #5a3d10 !important;
            border-color: #f5a623 !important;
            color: #ffe082;
            font-weight: bold;
        }
        .cell.outpost {
            border: 2px solid #e74c3c !important;
        }
        .cell.sector-NORTH { border-top: 2px solid #3498db; }
        .cell.sector-EAST  { border-right: 2px solid #f1c40f; }
        .cell.sector-SOUTH { border-bottom: 2px solid #e74c3c; }
        .cell.sector-WEST  { border-left: 2px solid #2ecc71; }
        
        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card-offering {
            background: #1a1d24;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2a2e39;
        }
        .card-list {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .card-item {
            flex: 1;
            background: #252934;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #3a3f50;
            cursor: pointer;
            text-align: center;
        }
        .card-item.selected {
            border-color: #f5a623;
            background: #323746;
        }
        .action-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }
        .action-btn:hover { background: #2ecc71; }
        .log-box {
            background: #111317;
            border: 1px solid #222630;
            height: 140px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            border-radius: 4px;
        }
        .speech-toast {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffeaa7;
            color: #2d3436;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            animation: riseFade 1.5s forwards;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes riseFade {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -15px); }
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <div>
            <h2>🔥 Trial of the Ages: Last Ember <small>(v2 Unity-Ready Clean Engine)</small></h2>
            <div id="statusInfo">
                <span class="resource-badge">Turn: <span id="valTurn">1</span>/50</span>
                <span class="resource-badge">🔥 生命: <span id="valEmber">20</span></span>
                <span class="resource-badge">🌾 食料: <span id="valFood">50</span></span>
                <span class="resource-badge">🧱 資材: <span id="valWood">50</span></span>
                <span class="resource-badge">✨ 神秘: <span id="valMystic">0</span></span>
                <span class="resource-badge">🛡️ リアルタイム全防衛: <span id="valDefense">10</span></span>
            </div>
        </div>
        <div>
            <button class="action-btn" onclick="nextTurn()">Turn 終了 ➔</button>
        </div>
    </div>

    <div class="main-container">
        <div class="board-container">
            <div style="margin-bottom: 10px; display: flex; justify-content: space-between;">
                <strong id="stageLabel">5x5 盤面 (Stage 1)</strong>
                <span>インデックス: 左上軸 1-9 / 右上軸 A-I</span>
            </div>
            <div id="gridBoard" class="grid-board"></div>
        </div>

        <div class="side-panel">
            <div class="card-offering">
                <h3>🎴 手札オファリング (盤面共鳴隠し味バイアス)</h3>
                <div id="cardList" class="card-list"></div>
            </div>

            <div class="card-offering">
                <h3>🏰 拠点建設コマンド (1拠点1方角限定)</h3>
                <p id="outpostCostInfo">建設コスト: 🧱 60 ＋ 🔥 3 (必要保有土地: 12マス以上)</p>
                <button class="action-btn" style="background:#e67e22;" onclick="toggleBuildOutpostMode()">🏰 拠点建設モード切替</button>
                <span id="outpostModeState" style="color:#aaa;">(通常モード)</span>
            </div>

            <div class="card-offering">
                <h3>📜 状況ログ ＆ 市民フキダシ</h3>
                <div id="logBox" class="log-box"></div>
            </div>
        </div>
    </div>

    <script src="src/v2_unity_ready_main.js"></script>
    <script>
        // Web View UI Controller (Observer Pattern)
        const engine = window.V2UnityReadyEngine;
        const state = new engine.GameState();
        const outpostSys = new engine.OutpostSystem(state);
        const drawSys = new engine.ResonanceDrawSystem(state);

        let selectedCard = null;
        let isBuildOutpostMode = false;

        function initUI() {
            drawSys.generateOfferingCards();
            render();
            addLog("ゲーム開始！v2 Unity C# 1対1対応クリーンエンジンが起動しました。");
        }

        function render() {
            // ステータス更新
            document.getElementById("valTurn").innerText = state.turn;
            document.getElementById("valEmber").innerText = state.ember;
            document.getElementById("valFood").innerText = state.food;
            document.getElementById("valWood").innerText = state.wood;
            document.getElementById("valMystic").innerText = state.mystic;
            document.getElementById("valDefense").innerText = state.calculateTotalDefense();
            document.getElementById("stageLabel").innerText = state.stage.name;

            // 拠点コスト情報
            const nextCost = state.getOutpostCost(state.outpostCount);
            if (nextCost) {
                document.getElementById("outpostCostInfo").innerText = `第 ${state.outpostCount+1} 拠点コスト: 🧱 ${nextCost.wood} ＋ 🔥 ${nextCost.ember} (必要土地: ${nextCost.reqTiles}マス以上)`;
            } else {
                document.getElementById("outpostCostInfo").innerText = `拠点上限 (最大 3 個) に達しました`;
            }

            // 盤面グリッド描画
            const boardEl = document.getElementById("gridBoard");
            const size = state.stage.size;
            boardEl.style.gridTemplateColumns = `repeat(${size}, 48px)`;
            boardEl.innerHTML = "";

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cellData = state.grid[r][c];
                    const cellEl = document.createElement("div");
                    const sector = state.getDirectionSector(r, c);
                    cellEl.className = `cell sector-${sector}`;

                    if (cellData.isHQ) {
                        cellEl.classList.add("hq");
                        cellEl.innerHTML = "HQ<br>E5";
                    } else if (cellData.isOutpost) {
                        cellEl.classList.add("outpost");
                        cellEl.innerHTML = `🏰<br>${sector[0]}`;
                    } else if (cellData.placed && cellData.terrain) {
                        cellEl.innerHTML = `${cellData.terrain.name}<br>🛡️${cellData.terrain.defense}`;
                    } else {
                        cellEl.innerHTML = `<span style="color:#555;">${r+1},${String.fromCharCode(65+c)}</span>`;
                    }

                    cellEl.onclick = () => onCellClick(r, c);
                    boardEl.appendChild(cellEl);
                }
            }

            // 手札カード描画
            const cardListEl = document.getElementById("cardList");
            cardListEl.innerHTML = "";
            state.handOffering.forEach((card, idx) => {
                const item = document.createElement("div");
                item.className = `card-item ${selectedCard === card ? 'selected' : ''}`;
                item.innerHTML = `<strong>${card.name}</strong><br><small>防衛 🛡️ ${card.terrain.defense}</small>`;
                item.onclick = () => {
                    selectedCard = card;
                    isBuildOutpostMode = false;
                    document.getElementById("outpostModeState").innerText = "(通常モード)";
                    render();
                };
                cardListEl.appendChild(item);
            });

            // 市民フキダシ表示
            while (state.speechQueue.length > 0) {
                const speech = state.speechQueue.shift();
                showToastSpeech(speech.r, speech.c, speech.text);
            }
        }

        function onCellClick(r, c) {
            if (isBuildOutpostMode) {
                const res = outpostSys.buildOutpost(r, c);
                if (res.success) {
                    addLog(`🏰 拠点建設成功！(${r+1},${String.fromCharCode(65+c)}) - 方角 ${res.outpost.direction} 視界確保`);
                    isBuildOutpostMode = false;
                    document.getElementById("outpostModeState").innerText = "(通常モード)";
                } else {
                    addLog(`❌ 拠点建設不可: ${res.reason}`);
                }
                render();
                return;
            }

            if (selectedCard) {
                const cell = state.grid[r][c];
                if (cell.isHQ || cell.isOutpost) {
                    addLog("❌ 本営や拠点の上に土地は置けません");
                    return;
                }
                cell.placed = true;
                cell.terrain = selectedCard.terrain;
                addLog(`🌱 土地配置: ${selectedCard.name} (${r+1},${String.fromCharCode(65+c)})`);
                selectedCard = null;
                render();
            }
        }

        function toggleBuildOutpostMode() {
            isBuildOutpostMode = !isBuildOutpostMode;
            selectedCard = null;
            document.getElementById("outpostModeState").innerText = isBuildOutpostMode ? "(🏰 建設マス選択中...)" : "(通常モード)";
            render();
        }

        function nextTurn() {
            state.turn++;
            if (state.turn === 16 && state.currentStageIndex === 0) {
                state.currentStageIndex = 1;
                state.stage = engine.BOARD_STAGES.STAGE_2;
                addLog("🎉 Stage 2 開幕！ 7x7 盤面拡大 ＆ 拠点建設が初解禁されました！");
            } else if (state.turn === 31 && state.currentStageIndex === 1) {
                state.currentStageIndex = 2;
                state.stage = engine.BOARD_STAGES.STAGE_3;
                addLog("👑 Stage 3 開幕！ 9x9 盤面拡大 ＆ 第 2・第 3 拠点自由建設解禁！");
            }
            drawSys.generateOfferingCards();
            render();
        }

        function addLog(msg) {
            const box = document.getElementById("logBox");
            box.innerHTML += `[T${state.turn}] ${msg}<br>`;
            box.scrollTop = box.scrollHeight;
        }

        function showToastSpeech(r, c, text) {
            const boardEl = document.getElementById("gridBoard");
            const toast = document.createElement("div");
            toast.className = "speech-toast";
            toast.innerText = text;
            boardEl.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        window.onload = initUI;
    </script>
</body>
</html>
