    <script src="src/ui/v2_ui_renderer.js"></script>
    <script>
        let state = null;
        let drawSys = null;
        let selectedCard = null;
        let selectedCardIdx = -1;

        document.addEventListener("DOMContentLoaded", () => {
            const engine = window.Step1Engine;
            if (!engine) return;
            state = new engine.GameState();
            window.state = state;
            drawSys = new engine.Step1DrawSystem(state);
            window.drawSys = drawSys;
            if (window.UndoLandSystem) {
                window.undoSys = new window.UndoLandSystem(state);
            }

            fetch('src/data/land_cards.json')
                .then(res => res.json())
                .then(data => {
                    window.LAND_CARDS_DATA = data;
                    initStaticI18nLabels();
                    init();
                })
                .catch(err => {
                    console.warn("Failed to load land_cards.json, using fallback:", err);
                    initStaticI18nLabels();
                    init();
                });

            const dp = document.querySelector(".data-panel");
            if (dp) {
                dp.onmousemove = (e) => showDataPanelTooltip(e);
                dp.onmouseleave = () => hideDataPanelTooltip();
            }
        });

        function initStaticI18nLabels() {
            const I18n = window.I18n;
            if (!I18n) return;
            document.title = I18n.t("UI_TITLE");
            setElementText("lblAppTitle", I18n.t("UI_TITLE"));
            setElementText("lblRoleAvatar", I18n.t("UI_ROLE_AVATAR"));
            setElementText("lblTurnHeader", I18n.t("UI_TURN_LABEL"));
            setElementText("lblOfferingTitle", I18n.t("UI_OFFERING_TITLE"));
            setElementText("lblReserveTitle", I18n.t("UI_RESERVE_TITLE"));
            setElementText("lblMainBadge", I18n.t("UI_MAIN_AREA_BADGE"));
            setElementText("lblDataPanelTitle", I18n.t("UI_DATA_PANEL_TITLE"));
            setElementText("lblBuffPanelTitle", I18n.t("UI_BUFF_PANEL_TITLE"));
            setElementText("lblFood", I18n.t("UI_FOOD"));
            setElementText("lblWood", I18n.t("UI_WOOD"));
            setElementText("lblDefense", I18n.t("UI_DEFENSE"));
            setElementText("lblMystic", I18n.t("UI_MYSTIC"));
            setElementText("lblLogTitle", I18n.t("UI_LOG_TITLE"));
            setElementText("btnLogToggle", "▼");
            setElementText("btnMulligan", I18n.t("UI_MULLIGAN_BTN"));
            setElementText("btnTurnEnd", I18n.t("UI_TURN_END_BTN"));
            setElementText("lblLogSub", I18n.t("UI_LOG_SUB_HINT"));
        }

        function init() {
            if (!drawSys) return;
            drawSys.generateOfferingCards();
            render();
        }

        function clearCellPreviews() {
            const cells = document.querySelectorAll(".cell");
            cells.forEach(c => {
                c.classList.remove("preview-valid", "preview-invalid", "merge-hover-highlight");
            });
            hideTileTooltip();
        }

        function highlightPlaceableCells() {
            if (!selectedCard || !state || state.hasPickedThisTurn) return;
            const shape = selectedCard.currentShape;
            if (!shape) return;

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    const check = state.canPlaceShape(r, c, shape);
                    if (check.can) {
                        const targetEl = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
                        if (targetEl) {
                            targetEl.classList.add("preview-valid");
                        }
                    }
                }
            }
        }

        function onCellMouseEnter(e, r, c) {
            if (!state) return;
            const cellData = state.grid[r][c];
            showTileTooltip(e, r, c, cellData);
            if (window.undoSys) window.undoSys.showHoverTooltip(e, r, c);

            // 同一マージグループ連動ホバーライトアップハイライト
            const groupId = cellData ? (cellData.mergeGroupId || cellData.placementGroupId) : null;
            if (groupId) {
                const groupCells = document.querySelectorAll(`.cell[data-group-id="${groupId}"]`);
                groupCells.forEach(el => el.classList.add("merge-hover-highlight"));
            }

            if (!selectedCard || state.hasPickedThisTurn) return;
            
            // 全体の配置可能緑枠を残しつつ、ホバー位置のプレビューを表示
            const shape = selectedCard.currentShape;
            const check = state.canPlaceShape(r, c, shape);
            const isValid = check.can;

            const rows = shape.length;
            const cols = shape[0].length;

            for (let dr = 0; dr < rows; dr++) {
                for (let dc = 0; dc < cols; dc++) {
                    if (shape[dr][dc] === 1) {
                        const tr = r + dr;
                        const tc = c + dc;
                        if (tr < 5 && tc < 5) {
                            const targetEl = document.querySelector(`.cell[data-r="${tr}"][data-c="${tc}"]`);
                            if (targetEl) {
                                targetEl.classList.add(isValid ? "preview-valid" : "preview-invalid");
                            }
                        }
                    }
                }
            }
        }

        function onCellMouseMove(e, r, c) {
            if (!state) return;
            const cellData = state.grid[r][c];
            showTileTooltip(e, r, c, cellData);
            if (window.undoSys) window.undoSys.updateHoverTooltipPosition(e);
        }

        function showTileTooltip(e, r, c, cell) {
            const tt = document.getElementById("tileTooltip");
            const I18n = window.I18n;
            if (!tt || !cell || !I18n) return;

            const pos = `(${String.fromCharCode(65+c)}${r+1})`;
            const isHQVic = state.isHQVicinity(r, c);

            if (cell.isHQ) {
                tt.innerHTML = `<strong>${I18n.t("TOOLTIP_HQ_TITLE", { pos })}</strong><br>${I18n.t("TOOLTIP_HQ_DESC")}`;
            } else if (cell.placed && cell.terrain) {
                const tName = I18n.t(cell.terrain.nameKey);
                const sName = cell.socketResource ? I18n.t(cell.socketResource.nameKey) : "";
                const mergeText = cell.merged ? `<br><span style="color:#f1c40f;font-weight:bold;">${I18n.t("UI_MERGE_2X2_LABEL", { name: tName })}</span>` : "";
                const socketText = cell.socketResource ? `<br><span style="color:#f1c40f;font-weight:bold;">★ ${sName} (${I18n.t("UI_SOCKET_BLOOMING")})</span>` : (cell.hasSocket ? `<br><span style="color:#f39c12;font-weight:bold;">${I18n.t("UI_UNOPENED_SOCKET_LABEL")}</span>` : "");
                const searchText = cell.searched ? `<br><span style="color:#2ecc71;">${I18n.t("UI_SEARCHED_BADGE")}</span>` : (cell.merged ? `<br><span style="color:#7f8c8d;">${I18n.t("UI_MERGED_SEARCH_DISABLED")}</span>` : "");
                tt.innerHTML = `<strong>${tName} ${pos}</strong>${mergeText}<br>🛡️${cell.terrain.defense} | 🌾+${cell.terrain.food||0} 🧱+${cell.terrain.wood||0}${isHQVic?' (+1)':''}${socketText}${searchText}`;
            } else if (cell.hasSocket) {
                tt.innerHTML = `<strong>${I18n.t("TOOLTIP_SOCKET_UNOPENED", { pos })}</strong>`;
            } else {
                tt.innerHTML = `<strong>${I18n.t("TOOLTIP_UNPLACED", { pos })}</strong>${isHQVic?`<br><small style="color:#1abc9c;">${I18n.t("TOOLTIP_HQ_VICINITY_BUFF")}</small>`:''}`;
            }

            tt.style.left = (e.clientX + 15) + "px";
            tt.style.top = (e.clientY + 15) + "px";
            tt.style.display = "block";
        }

        function hideTileTooltip() {
            const tt = document.getElementById("tileTooltip");
            if (tt) tt.style.display = "none";
            if (window.undoSys) window.undoSys.hideHoverTooltip();
        }

        function showDataPanelTooltip(e) {
            if (!state) return;
            const tt = document.getElementById("tileTooltip");
            const I18n = window.I18n;
            if (!tt || !I18n) return;
            const breakdown = state.getResourceBreakdown ? state.getResourceBreakdown() : null;
            if (!breakdown) return;

            const foodInfo = breakdown.food;
            const woodInfo = breakdown.wood;
            const defInfo = breakdown.defense;
            const mystInfo = breakdown.mystic;

            const lblHqBase = I18n.t("UI_BREAKDOWN_HQ_BASE") || "├ 本営基礎:";
            const lblTiles = I18n.t("UI_BREAKDOWN_TILES") || "├ 土地配置:";
            const lblSockets = I18n.t("UI_BREAKDOWN_SOCKETS") || "├ ソケット開花:";
            const lblVicinity = I18n.t("UI_BREAKDOWN_VICINITY") || "└ 本営近郊:";

            tt.innerHTML = `
                <div style="font-weight:bold; color:#1abc9c; margin-bottom:4px; border-bottom:1px solid #34495e; padding-bottom:2px;">
                    📊 ${I18n.t("UI_DATA_PANEL_TITLE")}
                </div>
                <div style="margin-bottom:4px;">
                    <strong style="color:#2ecc71;">${I18n.t("UI_FOOD")} (${foodInfo.total}/T):</strong><br>
                    ${lblHqBase} 10/T<br>
                    ${lblTiles} +${foodInfo.tiles}/T<br>
                    ${lblSockets} +${foodInfo.sockets}/T<br>
                    ${lblVicinity} +${foodInfo.vicinity}/T
                </div>
                <div style="margin-bottom:4px;">
                    <strong style="color:#e67e22;">${I18n.t("UI_WOOD")} (${woodInfo.total}/T):</strong><br>
                    ${lblHqBase} 10/T<br>
                    ${lblTiles} +${woodInfo.tiles}/T<br>
                    ${lblSockets} +${woodInfo.sockets}/T<br>
                    ${lblVicinity} +${woodInfo.vicinity}/T
                </div>
                <div style="margin-bottom:4px;">
                    <strong style="color:#3498db;">${I18n.t("UI_DEFENSE")} (${defInfo.total}):</strong><br>
                    ${lblHqBase} 10<br>
                    ${lblTiles} +${defInfo.tiles}<br>
                    ${lblSockets} +${defInfo.sockets}
                </div>
                <div>
                    <strong style="color:#9b59b6;">${I18n.t("UI_MYSTIC")} (${mystInfo.total}/T):</strong><br>
                    ${lblHqBase} 1/T<br>
                    ${lblTiles} +${mystInfo.tiles}/T<br>
                    ${lblSockets} +${mystInfo.sockets}/T
                </div>
            `;

            tt.style.display = "block";
            tt.style.position = "fixed";
            tt.style.left = (e.clientX + 15) + "px";
            tt.style.top = (e.clientY + 15) + "px";
            tt.style.zIndex = "9999";
        }

        function hideDataPanelTooltip() {
            const tt = document.getElementById("tileTooltip");
            if (tt) tt.style.display = "none";
        }

        function toggleLogDropdownPanel(e) {
            if (e) e.stopPropagation();
            const panel = document.getElementById("logDropdownPanelHeader");
            const arrow = document.getElementById("logHeaderArrow");
            if (!panel) return;

            const isCurrentlyOpen = (panel.style.display === "flex" || window.getComputedStyle(panel).display === "flex");
            if (isCurrentlyOpen) {
                panel.style.display = "none";
                if (arrow) arrow.innerHTML = "▽";
            } else {
                panel.style.display = "flex";
                if (arrow) arrow.innerHTML = "△";
            }
        }
        window.toggleLogDropdownPanel = toggleLogDropdownPanel;

        function setElementText(id, text) {
            const el = document.getElementById(id);
            if (el) el.innerText = text;
        }

        function render() {
            if (!state) return;
            const I18n = window.I18n;
            try {
                const prods = state.calculateTotalProduction();
                setElementText("lblDataPanelTitle", I18n ? I18n.t("UI_DATA_PANEL_TITLE") : "産出データ");
                setElementText("valTurn", state.turn);
                setElementText("valEmber", state.ember);
                setElementText("valFood", state.food);
                setElementText("valFoodProd", `+${prods.totalFood}`);
                setElementText("valWood", state.wood);
                setElementText("valWoodProd", `+${prods.totalWood}`);
                setElementText("valDefense", state.calculateTotalDefense());
                setElementText("valMystic", state.mystic);
                setElementText("valPlacedCount", `${state.countPlacedTiles()}/24`);

                if (typeof renderDirectiveHeaderBadge === "function") {
                    renderDirectiveHeaderBadge();
                }

                // 🎯 発動中バフパネルの表示・非表示制御
                const buffPanel = document.getElementById("activeBuffPanel");
                const buffContent = document.getElementById("activeBuffContent");
                setElementText("lblBuffPanelTitle", I18n.t("UI_BUFF_PANEL_TITLE"));

                if (buffPanel && buffContent) {
                    if (state.activeDrawBias) {
                        const bias = state.activeDrawBias;
                        let text = "";
                        if (bias.targetCategory === "LAND") text = I18n.t("UI_BUFF_BIAS_LAND");
                        else if (bias.targetCategory === "MILITARY") text = I18n.t("UI_BUFF_BIAS_MILITARY");
                        else if (bias.targetCategory === "MYSTIC") text = I18n.t("UI_BUFF_BIAS_MYSTIC");
                        
                        if (bias.type === "UNTIL_BLOCKS") text += I18n.t("UI_BUFF_UNTIL_BLOCKS", { count: bias.untilValue });
                        else if (bias.type === "UNTIL_DEFENSE") text += I18n.t("UI_BUFF_UNTIL_DEFENSE", { count: bias.untilValue });
                        else if (bias.type === "TURNS") text += I18n.t("UI_BUFF_TURNS", { count: bias.remainingTurns });

                        buffContent.innerText = text;
                        buffPanel.style.display = "block";
                    } else {
                        buffPanel.style.display = "none";
                    }
                }

                const boardEl = document.getElementById("gridBoard");
                if (boardEl) {
                    boardEl.innerHTML = "";

                    const cornerCell = document.createElement("div");
                    cornerCell.className = "header-cell corner-toggle-cell";
                    cornerCell.style.display = "flex";
                    cornerCell.style.alignItems = "center";
                    cornerCell.style.justifyContent = "center";

                    const currentMode = window.currentBoardMode || 'hover';
                    let modeIcon = "🏷️";
                    if (currentMode === 'icon') modeIcon = "🌾";
                    else if (currentMode === 'always') modeIcon = "👁️";

                    cornerCell.title = "土地表示モード切替";
                    cornerCell.innerHTML = `<button onclick="toggleBoardLabelMode(event)" style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; border-radius:4px; padding:2px 4px; font-size:12px; cursor:pointer;" title="土地表示モード切替">${modeIcon}</button>`;
                    boardEl.appendChild(cornerCell);

                    for (let c = 0; c < 5; c++) {
                        const hCell = document.createElement("div");
                        hCell.className = "header-cell";
                        hCell.innerText = String.fromCharCode(65 + c);
                        boardEl.appendChild(hCell);
                    }

                    for (let r = 0; r < 5; r++) {
                        const vCell = document.createElement("div");
                        vCell.className = "header-cell";
                        vCell.innerText = r + 1;
                        boardEl.appendChild(vCell);

                        for (let c = 0; c < 5; c++) {
                            const cellData = state.grid[r][c];
                            const cellEl = document.createElement("div");
                            cellEl.className = "cell";
                            cellEl.setAttribute("data-r", r);
                            cellEl.setAttribute("data-c", c);

                            const isHQVic = state.isHQVicinity(r, c);

                            if (cellData.isHQ) {
                                cellEl.classList.add("hq");
                                cellEl.innerHTML = I18n.t("TERRAIN_HQ");
                            } else if (cellData.placed && cellData.terrain) {
                                cellEl.classList.add("placed");

                                const tid = cellData.terrain ? (cellData.terrain.terrainId || cellData.terrain.id || "") : "";
                                if (tid.includes("PLAINS")) cellEl.classList.add("terrain-plains");
                                else if (tid.includes("DEEP_FOREST") || tid.includes("DEEP_HILL")) cellEl.classList.add("terrain-deep-forest");
                                else if (tid.includes("FOREST")) cellEl.classList.add("terrain-forest");
                                else if (tid.includes("HILL")) cellEl.classList.add("terrain-hill");
                                else if (tid.includes("MOUNTAIN")) cellEl.classList.add("terrain-mountain");
                                else if (tid.includes("DESERT")) cellEl.classList.add("terrain-desert");

                                const tName = I18n.t(cellData.terrain.nameKey);
                                const mergeId = cellData.mergeGroupId;
                                const placeId = cellData.placementGroupId;
                                const activeGroupId = mergeId || placeId;

                                 if (activeGroupId) {
                                     cellEl.setAttribute("data-group-id", activeGroupId);
                                     if (cellData.merged) {
                                         // 🌟 差別化案C: マージ領域は黄金発光＋格調高い黄金マージコアと元のマス目名残を維持
                                         cellEl.classList.add("merged");
                                         const tid = cellData.terrain ? (cellData.terrain.terrainId || cellData.terrain.id) : "";
                                         if (tid.includes("PLAINS")) cellEl.classList.add("merged-plains");
                                         else if (tid.includes("DEEP_FOREST") || tid.includes("DEEP_HILL")) cellEl.classList.add("merged-deep-forest");
                                         else if (tid.includes("FOREST")) cellEl.classList.add("merged-forest");
                                         else if (tid.includes("HILL")) cellEl.classList.add("merged-hill");
                                         else if (tid.includes("MOUNTAIN")) cellEl.classList.add("merged-mountain");
                                         else if (tid.includes("DESERT")) cellEl.classList.add("merged-desert");

                                         // マージ領域は境界線の名残(薄い破線)を維持
                                         cellEl.style.borderColor = "rgba(241, 196, 15, 0.4)";
                                         cellEl.style.borderStyle = "dashed";
                                     } else if (placeId) {
                                         // ⛰️ 差別化案C: 元々多マスカードは内部境界線を完全に消去し「シームレスな一枚岩」として結合描画
                                         const topSame = (r > 0 && state.grid[r-1][c].placementGroupId === placeId);
                                         const rightSame = (c < 4 && state.grid[r][c+1].placementGroupId === placeId);
                                         const bottomSame = (r < 4 && state.grid[r+1][c].placementGroupId === placeId);
                                         const leftSame = (c > 0 && state.grid[r][c-1].placementGroupId === placeId);

                                         if (topSame) {
                                             cellEl.classList.add("no-border-top", "no-radius-tl", "no-radius-tr");
                                             cellEl.style.setProperty("border-top", "none", "important");
                                             cellEl.style.marginTop = "-4px";
                                             cellEl.style.height = "calc(100% + 4px)";
                                         }
                                         if (rightSame) {
                                             cellEl.classList.add("no-border-right", "no-radius-tr", "no-radius-br");
                                             cellEl.style.setProperty("border-right", "none", "important");
                                             cellEl.style.width = "calc(100% + 4px)";
                                             cellEl.style.zIndex = "2";
                                         }
                                         if (bottomSame) {
                                             cellEl.classList.add("no-border-bottom", "no-radius-bl", "no-radius-br");
                                             cellEl.style.setProperty("border-bottom", "none", "important");
                                             cellEl.style.height = "calc(100% + 4px)";
                                             cellEl.style.zIndex = "2";
                                         }
                                         if (leftSame) {
                                             cellEl.classList.add("no-border-left", "no-radius-tl", "no-radius-bl");
                                             cellEl.style.setProperty("border-left", "none", "important");
                                             cellEl.style.marginLeft = "-4px";
                                             cellEl.style.width = "calc(100% + 4px)";
                                         }
                                     }

                                     // マージ領域・多マスカードの内側接続チェック (ラベル位置決定用)
                                     const topGroupSame = (r > 0 && (state.grid[r-1][c].mergeGroupId === activeGroupId || state.grid[r-1][c].placementGroupId === activeGroupId));
                                     const leftGroupSame = (c > 0 && (state.grid[r][c-1].mergeGroupId === activeGroupId || state.grid[r][c-1].placementGroupId === activeGroupId));

                                     if (!topGroupSame && !leftGroupSame) {
                                         const socketText = cellData.socketResource ? `<br><small style="color:#f1c40f;">★${I18n.t(cellData.socketResource.nameKey)}</small>` : "";
                                         if (cellData.merged && cellData.mergeType === "2x2") {
                                             cellEl.innerHTML = `<span style="font-size:12px; color:#f1c40f; font-weight:bold; white-space:nowrap; z-index:5; text-shadow:0 0 6px rgba(0,0,0,0.9);">${I18n.t("UI_MERGE_2X2_LABEL", { name: tName })}${socketText}</span>`;
                                         } else {
                                             // 幾何学的中心センタリング (一体型カードのタイトル表記)
                                             const hasRight = (c < 4 && state.grid[r][c+1].placementGroupId === placeId);
                                             const hasBottom = (r < 4 && state.grid[r+1][c].placementGroupId === placeId);
                                             let spanStyle = "font-size:13px; color:#fff; font-weight:bold; z-index:5; text-shadow:0 2px 4px rgba(0,0,0,0.8); pointer-events:none;";
                                             if (hasRight && !hasBottom) {
                                                 spanStyle += " position:absolute; left:0; width:200%; text-align:center;";
                                             } else if (hasBottom && !hasRight) {
                                                 spanStyle += " position:absolute; top:0; left:0; width:100%; height:200%; display:flex; align-items:center; justify-content:center;";
                                             }
                                             cellEl.innerHTML = `<span style="${spanStyle}">${tName}${socketText}</span>`;
                                         }
                                     } else {
                                         const socketBadge = cellData.socketResource ? `<small style="color:#f1c40f; font-size:10px;">★${I18n.t(cellData.socketResource.nameKey)}</small>` : "";
                                         cellEl.innerHTML = socketBadge;
                                     }
                                } else {
                                    const socketBadge = cellData.socketResource ? `<br><small style="color:#f1c40f; font-size:10px;">★${I18n.t(cellData.socketResource.nameKey)}</small>` : "";
                                    const searchedBadge = cellData.searched ? `<span class="searched-badge">${I18n.t("UI_SEARCHED_BADGE")}</span>` : "";
                                    cellEl.innerHTML = `${tName}${socketBadge}${searchedBadge}`;
                                }
                            } else if (cellData.hasSocket) {
                                cellEl.classList.add("socket-unopened");
                                if (isHQVic) cellEl.classList.add("hq-vicinity-unplaced");
                                cellEl.innerHTML = `<span style="color:#f39c12;font-size:22px;filter:drop-shadow(0 0 4px #f39c12);">★</span>`;
                            } else {
                                if (isHQVic) {
                                    cellEl.classList.add("hq-vicinity-unplaced");
                                    cellEl.innerHTML = `<span style="font-size:12px; color:#1abc9c; opacity:0.8;">✨+1</span>`;
                                }
                            }

                            cellEl.onmouseenter = (e) => onCellMouseEnter(e, r, c);
                            cellEl.onmousemove = (e) => onCellMouseMove(e, r, c);
                            cellEl.onmouseleave = clearCellPreviews;
                            cellEl.onclick = () => onCellClick(r, c);
                            cellEl.oncontextmenu = (e) => {
                                e.preventDefault();
                                if (selectedCard) {
                                    const activeIdx = selectedCardIdx !== -1 ? selectedCardIdx : 0;
                                    rotateSelectedCard(e, activeIdx);
                                }
                            };
                            boardEl.appendChild(cellEl);
                        }
                    }
                }

                // 1. ドローオファリングエリア描画
                const cardRowEl = document.getElementById("cardRow");
                if (cardRowEl) {
                    cardRowEl.innerHTML = "";
                    state.handOffering.forEach((card, idx) => {
                        if (!card) return;

                        if (card.isBlank) {
                            const blankEl = document.createElement("div");
                            blankEl.className = "card-frame-tcg locked";
                            blankEl.style.cssText = "background:#11141d; border:2px dashed #7f8c8d; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;";
                            blankEl.innerHTML = `<div style="font-size:28px; color:#e74c3c; font-weight:bold;">✖</div>`;
                            cardRowEl.appendChild(blankEl);
                            return;
                        }

                        const isSelected = (selectedCardIdx === idx);
                        const isLocked = state.hasPickedThisTurn;
                        const tObj = card.terrain || card;
                        const category = tObj.category || "LAND";
                        const rCode = tObj.rarity || "C";
                        const rarityClass = `rarity-${rCode.toLowerCase()}`;
                        const categoryClass = category !== "LAND" ? `category-${category.toLowerCase()}` : "";

                        // コストチェック
                        let costMet = true;
                        let costBadgeText = "";
                        if (category !== "LAND") {
                            if (tObj.cost) {
                                const c = tObj.cost;
                                const parts = [];
                                if (c.food) { parts.push(`🌾-${c.food}`); if (state.food < c.food) costMet = false; }
                                if (c.wood) { parts.push(`🧱-${c.wood}`); if (state.wood < c.wood) costMet = false; }
                                if (c.mystic) { parts.push(`✨-${c.mystic}`); if (state.mystic < c.mystic) costMet = false; }
                                if (c.ember) { parts.push(`🔥-${c.ember}`); if (state.ember < c.ember) costMet = false; }
                                costBadgeText = parts.join(" ");
                            }
                        }

                        const isPinned = (window.pinnedPreviewCard === card);
                        const cardEl = document.createElement("div");
                        cardEl.className = `card-frame-tcg ${rarityClass} ${categoryClass} ${isSelected ? 'selected' : ''} ${isPinned ? 'pinned' : ''} ${isLocked ? 'locked' : ''} ${!costMet ? 'cost-disabled' : ''}`;
                        cardEl.onmouseenter = (e) => {
                            showCardHoverPreview(card);
                            showCardRotateTooltip(e, card);
                        };
                        cardEl.onmousemove = (e) => {
                            moveCardRotateTooltip(e);
                        };
                        cardEl.onmouseleave = () => {
                            hideCardHoverPreview();
                            hideCardRotateTooltip();
                        };
                        cardEl.onclick = (e) => {
                            e.stopPropagation();
                            togglePinCardPreview(card);
                            selectCard(idx);
                        };
                        cardEl.oncontextmenu = (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            if (category === "LAND") rotateSelectedCard(e, idx);
                        };

                        const cName = tObj.nameKey ? I18n.t(tObj.nameKey) : (tObj.id || "Card");
                        const cDesc = tObj.descriptionKey ? I18n.t(tObj.descriptionKey) : (tObj.description || "");

                        if (category !== "LAND") {
                            // コマンド / イベント / 施設 / 奇跡カード用ビジュアル描画
                            let iconSymbol = "📜";
                            if (category === "MILITARY") iconSymbol = "🛡️";
                            else if (category === "MYSTIC") iconSymbol = "✨";
                            else if (category === "FACILITY") iconSymbol = "🏛️";
                            else if (category === "ECONOMY") iconSymbol = "📜";
                            else if (category === "LEGEND") iconSymbol = "🟡";

                            cardEl.innerHTML = `
                                <div class="tcg-card-top-bar">
                                    <div class="tcg-title-pill">${cName}</div>
                                    <div class="tcg-rarity-code">${rCode}</div>
                                </div>
                                <div class="tcg-shape-art-area" style="display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start; background:#2c3e50; padding:4px 6px; text-align:left; overflow:hidden;">
                                    <div style="font-size:14px; line-height:1.1; margin-bottom:2px; width:100%; text-align:center;">${iconSymbol}</div>
                                    <div style="font-size:9px; color:#ffffff; line-height:1.25; font-weight:normal; text-align:left; width:100%; text-shadow:0 1px 2px rgba(0,0,0,0.8);">${cDesc}</div>
                                </div>
                                <div class="tcg-yield-strip" style="font-size:9.5px; text-align:left; justify-content:flex-start; padding:3px 6px; width:100%; box-sizing:border-box;">
                                    <span>${costBadgeText ? (typeof I18n !== 'undefined' ? I18n.t("UI_CARD_COST_PREFIX", { cost: costBadgeText }) : 'Cost: ' + costBadgeText) : (typeof I18n !== 'undefined' ? I18n.t("UI_CMD_INSTANT_LABEL") : 'Instant')}</span>
                                </div>
                                <div class="tcg-action-controls">
                                    <button class="tcg-reserve-btn-wireframe" onclick="event.stopPropagation(); reserveCard(${idx})">${I18n.t("UI_RESERVE_BTN")}</button>
                                </div>
                            `;
                        } else {
                            // 土地カード用標準描画
                            const y = tObj.yields || {
                                food: tObj.food || 0,
                                wood: tObj.wood || 0,
                                defense: tObj.def || tObj.defense || 0,
                                mystic: tObj.mystic || 0
                            };
                            const shapeMat = card.currentShape || tObj.shape || [[1]];
                            const tileCount = shapeMat.reduce((acc, row) => acc + row.reduce((a, b) => a + b, 0), 0);
                            const totF = (y.food || 0) * tileCount;
                            const totW = (y.wood || 0) * tileCount;
                            const totD = (y.defense || 0) * tileCount;
                            const totM = (y.mystic || 0) * tileCount;

                            let shapeHtml = `<div style="display:grid; grid-template-rows:repeat(${shapeMat.length}, 10px); grid-template-columns:repeat(${shapeMat[0].length}, 10px); gap:2px;">`;
                            for (let r = 0; r < shapeMat.length; r++) {
                                for (let c = 0; c < shapeMat[0].length; c++) {
                                    if (shapeMat[r][c] === 1) {
                                        shapeHtml += `<div style="width:10px;height:10px;background:#0097a7;border-radius:2px;"></div>`;
                                    } else {
                                        shapeHtml += `<div style="width:10px;height:10px;background:transparent;"></div>`;
                                    }
                                }
                            }
                            shapeHtml += `</div>`;

                            let yieldText = `<span>🌾${totF}</span> <span>🧱${totW}</span> <span>🛡️${totD}</span>`;
                            if (totM > 0) yieldText += ` <span>✨${totM}</span>`;

                            cardEl.innerHTML = `
                                <div class="tcg-card-top-bar">
                                    <div class="tcg-title-pill">${cName}</div>
                                    <div class="tcg-rarity-code">${rCode}</div>
                                </div>
                                <div class="tcg-shape-art-area" style="display:flex; align-items:center; justify-content:center;">
                                    ${shapeHtml}
                                </div>
                                <div class="tcg-yield-strip">
                                    ${yieldText}
                                </div>
                                <div class="tcg-action-controls">
                                    <button class="tcg-reserve-btn-wireframe" onclick="event.stopPropagation(); reserveCard(${idx})">${I18n.t("UI_RESERVE_BTN")}</button>
                                </div>
                            `;
                        }
                        cardRowEl.appendChild(cardEl);
                    });
                }

                // 2. 保留エリア描画
                const reserveRowEl = document.getElementById("reserveRow");
                if (reserveRowEl) {
                    reserveRowEl.innerHTML = "";
                    for (let i = 0; i < 3; i++) {
                        const card = state.reserveSlots[i];
                        if (card) {
                            const cName = I18n.t(card.terrain.nameKey);
                            const cardEl = document.createElement("div");
                            cardEl.className = "card-frame-tcg rarity-c";
                            cardEl.innerHTML = `
                                <div class="tcg-card-top-bar">
                                    <div class="tcg-title-pill" style="border-color:#d35400;">${cName}</div>
                                    <div class="tcg-rarity-code" style="color:#d35400;">C</div>
                                </div>
                                <div class="tcg-shape-art-area" style="background:#fff3e0;">
                                    <div style="width:12px;height:12px;background:#e67e22;border-radius:2px;"></div>
                                </div>
                                <div class="tcg-yield-strip" style="background:#fff3e0;">
                                    <span>🌾: ${card.terrain.food||0}</span>
                                    <span>🧱: ${card.terrain.wood||0}</span>
                                    <span>🛡️ ${card.terrain.defense||0}</span>
                                </div>
                                <div class="tcg-action-controls">
                                    <button class="tcg-reserve-btn-wireframe" style="background:#e67e22;" onclick="event.stopPropagation(); returnReserveCard(${i})">${I18n.t("UI_RESERVE_RETURN_BTN")}</button>
                                </div>
                            `;
                            reserveRowEl.appendChild(cardEl);
                        } else {
                            const emptySlotEl = document.createElement("div");
                            emptySlotEl.className = "reserve-slot";
                            emptySlotEl.style.cssText = "width:115px; height:172.5px; aspect-ratio:2/3; background:#12141c; border:2px dashed #34495e; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#7f8c8d; margin:0 auto;";
                            emptySlotEl.innerText = I18n.t("UI_RESERVE_EMPTY", { slot: i + 1 });
                            reserveRowEl.appendChild(emptySlotEl);
                        }
                    }
                }

                // 3. ログエリアリアルタイム描画 ＆ スムーズスクロール追従
                const logContentEl = document.getElementById("logContent");
                if (logContentEl && state.gameLogs) {
                    logContentEl.innerHTML = state.gameLogs.map(log => `<div class="log-item" style="padding:4px 8px; border-bottom:1px solid #1a2233; font-size:12px; color:#dcdde1; line-height:1.4;">${log}</div>`).join("");
                    logContentEl.scrollTop = logContentEl.scrollHeight;
                }
            } catch (err) {
                console.error("Render Error:", err);
            }
        }

        function playCommandCard(card, targetIdx) {
            if (!state || state.hasPickedThisTurn) return;
            const tObj = card ? (card.terrain || card) : null;
            if (!tObj) return;
            const I18n = window.I18n;

            if (tObj.cost) {
                const c = tObj.cost;
                if (c.food && state.food < c.food) return;
                if (c.wood && state.wood < c.wood) return;
                if (c.mystic && state.mystic < c.mystic) return;
                if (c.ember && state.ember < c.ember) return;

                if (c.food) state.food -= c.food;
                if (c.wood) state.wood -= c.wood;
                if (c.mystic) state.mystic -= c.mystic;
                if (c.ember) state.ember -= c.ember;
            }

            if (tObj.biasTarget) {
                state.activeDrawBias = {
                    targetCategory: tObj.biasTarget,
                    type: tObj.biasUntilBlocks ? "UNTIL_BLOCKS" : (tObj.biasUntilDefense ? "UNTIL_DEFENSE" : "TURNS"),
                    untilValue: tObj.biasUntilBlocks || tObj.biasUntilDefense,
                    remainingTurns: tObj.biasDurationTurns
                };
            }

            // 🎯 手札オファリング配列からの確実に消去（インデックス指定 ＋ ID照合 ＋ 参照照合）
            let cardIdx = (typeof targetIdx === "number" && targetIdx >= 0) ? targetIdx : -1;
            if (cardIdx === -1) {
                cardIdx = state.handOffering.indexOf(card);
            }
            if (cardIdx === -1 && card) {
                cardIdx = state.handOffering.findIndex(c => c && (c === card || c.id === card.id || c.cardMasterId === card.cardMasterId));
            }

            if (cardIdx !== -1) {
                state.handOffering[cardIdx] = null;
            }

            // 🧹 発動時に右下のピン留めプレビュー・ツールチップを強制消去
            window.pinnedPreviewCard = null;
            if (typeof hideCardHoverPreview === "function") hideCardHoverPreview(true);
            if (typeof hideCardRotateTooltip === "function") hideCardRotateTooltip();

            state.hasPickedThisTurn = true;
            const cName = tObj.nameKey ? (I18n ? I18n.t(tObj.nameKey) : tObj.nameKey) : (tObj.id || "Command Card");
            state.addLog(`[T${state.turn}] ${cName} を発動しました。`);
            render();
        }
        window.playCommandCard = playCommandCard;

        function selectCard(idx) {
            if (!state || state.hasPickedThisTurn) return;
            const card = state.handOffering[idx];
            if (!card || card.isBlank) return;

            if (selectedCardIdx === idx) {
                selectedCard = null;
                selectedCardIdx = -1;
                render();
                highlightPlaceableCells();
                return;
            }

            selectedCard = card;
            selectedCardIdx = idx;
            render();
            highlightPlaceableCells();

            // 📜 コマンドカード選択時の確認ダイアログ発動連携
            const tObj = card.terrain || card;
            const category = card.category || tObj.category || "LAND";
            if (category !== "LAND" && window.ModalSystem) {
                const I18n = window.I18n;
                const cName = tObj.nameKey ? (I18n ? I18n.t(tObj.nameKey) : tObj.nameKey) : (tObj.id || "Card");
                const cDesc = tObj.descriptionKey ? (I18n ? I18n.t(tObj.descriptionKey) : tObj.descriptionKey) : "";
                
                let costBadgeText = "";
                if (tObj.cost) {
                    const c = tObj.cost;
                    const parts = [];
                    if (c.food) parts.push(`🌾-${c.food}`);
                    if (c.wood) parts.push(`🧱-${c.wood}`);
                    if (c.mystic) parts.push(`✨-${c.mystic}`);
                    if (c.ember) parts.push(`🔥-${c.ember}`);
                    costBadgeText = parts.join(" ");
                }

                window.ModalSystem.showConfirmDialog({
                    title: `📜 ${cName} を発動しますか？`,
                    descText: cDesc,
                    costText: costBadgeText,
                    confirmLabel: "⚡ 発動する",
                    cancelLabel: "✖ キャンセル",
                    onConfirm: () => {
                        playCommandCard(card, idx);
                        selectedCard = null;
                        selectedCardIdx = -1;
                        render();
                    },
                    onCancel: () => {
                        selectedCard = null;
                        selectedCardIdx = -1;
                        render();
                    }
                });
            }
        }
        window.selectCard = selectCard;

        function showCardHoverPreview(card) {
            const modal = document.getElementById("cardHoverPreviewModal");
            const content = document.getElementById("cardHoverPreviewContent");
            const I18n = window.I18n;
            if (!modal || !content || !card || !I18n) return;

            const tObj = card.terrain || card;
            const category = tObj.category || "LAND";
            const rCode = tObj.rarity || "C";
            const cName = tObj.nameKey ? I18n.t(tObj.nameKey) : (tObj.id || "Card");
            const cDesc = tObj.descriptionKey ? I18n.t(tObj.descriptionKey) : (tObj.description || "");

            let costBadgeText = "";
            if (category !== "LAND" && tObj.cost) {
                const c = tObj.cost;
                const parts = [];
                if (c.food) parts.push(`🌾-${c.food}`);
                if (c.wood) parts.push(`🧱-${c.wood}`);
                if (c.mystic) parts.push(`✨-${c.mystic}`);
                if (c.ember) parts.push(`🔥-${c.ember}`);
                costBadgeText = parts.join(" ");
            }

            if (category !== "LAND") {
                let iconSymbol = "📜";
                if (category === "MILITARY") iconSymbol = "🛡️";
                else if (category === "MYSTIC") iconSymbol = "✨";
                else if (category === "FACILITY") iconSymbol = "🏛️";
                else if (category === "ECONOMY") iconSymbol = "📜";
                else if (category === "LEGEND") iconSymbol = "🟡";

                content.innerHTML = `
                    <div style="display:flex; justify-content:center; align-items:center; position:relative; background:#ffffff; border-radius:8px; padding:6px 12px; border:2px solid #111;">
                        <strong style="font-size:17px; color:#111; text-align:center; width:100%; font-weight:bold;">${cName}</strong>
                        <span style="font-size:20px; font-weight:900; color:#111; position:absolute; right:12px;">${rCode}</span>
                    </div>
                    <div style="flex:1; background:#2c3e50; border-radius:10px; margin:8px 0; padding:14px; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start; border:1px solid #7f8c8d; text-align:left;">
                        <div style="font-size:32px; margin-bottom:8px; width:100%; text-align:center; filter:drop-shadow(0 0 8px rgba(255,255,255,0.6));">${iconSymbol}</div>
                        <div style="font-size:14px; color:#ffffff; line-height:1.45; font-weight:bold; text-align:left; text-shadow:0 2px 4px rgba(0,0,0,0.9); width:100%;">${cDesc}</div>
                    </div>
                    <div style="background:#d4f4fa; border-radius:8px; padding:8px 12px; text-align:left; font-size:14px; font-weight:bold; color:#111; display:flex; justify-content:flex-start; align-items:center;">
                        ${costBadgeText ? I18n.t("UI_CARD_COST_PREFIX", { cost: costBadgeText }) : I18n.t("UI_CMD_INSTANT_LABEL")}
                    </div>
                `;
            } else {
                const y = tObj.yields || { food: tObj.food || 0, wood: tObj.wood || 0, defense: tObj.def || tObj.defense || 0, mystic: tObj.mystic || 0 };
                const shapeMat = card.currentShape || tObj.shape || [[1]];
                const tileCount = shapeMat.reduce((acc, row) => acc + row.reduce((a, b) => a + b, 0), 0);
                const totF = (y.food || 0) * tileCount;
                const totW = (y.wood || 0) * tileCount;
                const totD = (y.defense || 0) * tileCount;
                const totM = (y.mystic || 0) * tileCount;

                let shapeHtml = `<div style="display:grid; grid-template-rows:repeat(${shapeMat.length}, 24px); grid-template-columns:repeat(${shapeMat[0].length}, 24px); gap:4px;">`;
                for (let r = 0; r < shapeMat.length; r++) {
                    for (let c = 0; c < shapeMat[0].length; c++) {
                        if (shapeMat[r][c] === 1) {
                            shapeHtml += `<div style="width:24px;height:24px;background:#0097a7;border-radius:4px;box-shadow:0 0 6px rgba(0,151,167,0.8);"></div>`;
                        } else {
                            shapeHtml += `<div style="width:24px;height:24px;background:transparent;"></div>`;
                        }
                    }
                }
                shapeHtml += `</div>`;

                let yieldText = `<span>🌾${totF}</span> <span>🧱${totW}</span> <span>🛡️${totD}</span>`;
                if (totM > 0) yieldText += ` <span>✨${totM}</span>`;

                content.innerHTML = `
                    <div style="display:flex; justify-content:center; align-items:center; position:relative; background:#ffffff; border-radius:8px; padding:6px 12px; border:2px solid #111;">
                        <strong style="font-size:17px; color:#111; text-align:center; width:100%; font-weight:bold;">${cName}</strong>
                        <span style="font-size:20px; font-weight:900; color:#111; position:absolute; right:12px;">${rCode}</span>
                    </div>
                    <div style="flex:1; background:#d4f4fa; border-radius:10px; margin:8px 0; display:flex; align-items:center; justify-content:center; border:1px solid #7f8c8d;">
                        ${shapeHtml}
                    </div>
                    <div style="background:#d4f4fa; border-radius:8px; padding:6px 12px; display:flex; justify-content:space-around; align-items:center; font-size:15px; font-weight:bold; color:#111;">
                        ${yieldText}
                    </div>
                `;
            }

            modal.style.display = "block";
        }

        window.pinnedPreviewCard = null;

        function togglePinCardPreview(card) {
            const current = window.pinnedPreviewCard;
            const isSame = current && (current === card || (current.id && card.id && current.id === card.id));
            if (isSame) {
                window.pinnedPreviewCard = null;
                hideCardHoverPreview(true);
            } else {
                window.pinnedPreviewCard = card;
                showCardHoverPreview(card);
            }
            render();
        }
        window.togglePinCardPreview = togglePinCardPreview;

        function hideCardHoverPreview(force = false) {
            if (!force && window.pinnedPreviewCard) return;
            const modal = document.getElementById("cardHoverPreviewModal");
            if (modal) modal.style.display = "none";
        }

        function canRotateCard(card) {
            if (!card || card.isBlank) return false;
            const tObj = card.terrain || card;
            const category = tObj.category || "LAND";
            if (category !== "LAND") return false;
            const shape = card.currentShape || tObj.shape;
            if (!shape || !Array.isArray(shape)) return false;
            const rows = shape.length;
            const cols = (shape[0] && Array.isArray(shape[0])) ? shape[0].length : 0;
            return (rows > 1 || cols > 1);
        }

        function showCardRotateTooltip(e, card) {
            if (!canRotateCard(card)) return;
            const tt = document.getElementById("cardRotateCursorTooltip");
            const I18n = window.I18n;
            if (!tt || !I18n) return;
            tt.innerText = I18n.t("UI_HOVER_RIGHT_CLICK_ROTATE");
            tt.style.display = "block";
            if (e) {
                tt.style.top = (e.clientY + 16) + "px";
                tt.style.left = (e.clientX + 16) + "px";
            }
        }

        function moveCardRotateTooltip(e) {
            const tt = document.getElementById("cardRotateCursorTooltip");
            if (!tt || tt.style.display === "none") return;
            if (e) {
                tt.style.top = (e.clientY + 16) + "px";
                tt.style.left = (e.clientX + 16) + "px";
            }
        }

        function hideCardRotateTooltip() {
            const tt = document.getElementById("cardRotateCursorTooltip");
            if (tt) tt.style.display = "none";
        }

        function rotateSelectedCard(e, idx) {
            if (e) e.stopPropagation();
            if (!state) return;
            const card = state.handOffering[idx];
            if (!card || card.isBlank || !card.currentShape) return;
            
            // 90度回転行列計算 (1x2 [[1, 1]] -> 2x1 [[1], [1]])
            const oldShape = card.currentShape;
            const rows = oldShape.length;
            const cols = oldShape[0].length;
            const newShape = [];
            for (let c = 0; c < cols; c++) {
                const newRow = [];
                for (let r = rows - 1; r >= 0; r--) {
                    newRow.push(oldShape[r][c]);
                }
                newShape.push(newRow);
            }
            card.currentShape = newShape;

            render();
            if (selectedCardIdx === idx) {
                highlightPlaceableCells();
            }
        }

        function onCellClick(r, c) {
            if (!state) return;
            const I18n = window.I18n;

            // ↩ 当ターンで配置した土地マスのクリック ➔ 即座にUndo実行
            if (window.undoSys && window.undoSys.isCellPlacedThisTurn(r, c)) {
                window.undoSys.undo();
                return;
            }

            if (!selectedCard || state.hasPickedThisTurn) return;

            const shape = selectedCard.currentShape;
            const terrain = selectedCard.terrain;

            // 📸 土地配置直前のディープスナップショット保存 (配置される全マス座標の計算)
            if (window.undoSys) {
                const placedCoords = [];
                if (shape && Array.isArray(shape)) {
                    for (let dr = 0; dr < shape.length; dr++) {
                        for (let dc = 0; dc < shape[dr].length; dc++) {
                            if (shape[dr][dc] === 1) {
                                placedCoords.push({ r: r + dr, c: c + dc });
                            }
                        }
                    }
                } else {
                    placedCoords.push({ r, c });
                }
                window.undoSys.captureSnapshot(placedCoords);
            }

            const currentIdx = selectedCardIdx !== -1 ? selectedCardIdx : state.handOffering.indexOf(selectedCard);
            const res = state.placeShape(r, c, shape, terrain, currentIdx);

            if (res === true || (res && (res.can || res.success))) {
                window.pinnedPreviewCard = null;
                hideCardHoverPreview(true);
                selectedCard = null;
                selectedCardIdx = -1;

                // 2x2 合体（Merger）判定を実行
                state.checkMergePatterns();

                render();
            } else {
                if (window.undoSys) window.undoSys.clearSnapshot();
                alert(I18n.t("ALERT_CANNOT_PLACE"));
            }
        }

        function showPlacementBonusToast(r, c, bonuses) {
            const cellEl = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
            if (!cellEl) return;
            const toast = document.createElement("div");
            toast.className = "tile-bonus-toast";
            
            const parts = [];
            if (bonuses.food > 0) parts.push(`🌾+${bonuses.food}`);
            if (bonuses.wood > 0) parts.push(`🧱+${bonuses.wood}`);
            if (bonuses.defense > 0) parts.push(`🛡️+${bonuses.defense}`);
            if (bonuses.ember > 0) parts.push(`🔥+${bonuses.ember}`);
            
            toast.innerText = parts.length > 0 ? parts.join(" ") : "Placement Success!";
            cellEl.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function reserveCard(idx) {
            if (!state) return;
            window.pinnedPreviewCard = null;
            hideCardHoverPreview(true);
            if (state.moveToReserve(idx)) {
                selectedCard = null;
                selectedCardIdx = -1;
                render();
            }
        }
        function returnReserveCard(idx) {
            if (!state) return;
            if (state.returnFromReserve(idx)) {
                window.pinnedPreviewCard = null;
                hideCardHoverPreview(true);
                selectedCard = null;
                selectedCardIdx = -1;
                render();
            }
        }
        function mulligan() {
            if (!state || !drawSys) return;
            window.pinnedPreviewCard = null;
            hideCardHoverPreview(true);
            state.ember -= 1;
            drawSys.generateOfferingCards();
            render();
        }
        function nextTurn() {
            if (!state || !drawSys) return;
            if (window.undoSys) window.undoSys.clearSnapshot();
            state.turn++;
            state.hasPickedThisTurn = false;
            drawSys.generateOfferingCards();
            render();
        }
        function toggleLogPanel() {
            const wrapper = document.getElementById("logPanelWrapper");
            const btn = document.getElementById("btnLogToggle");
            if (wrapper) {
                const isCollapsed = wrapper.classList.toggle("collapsed");
                if (btn) {
                    btn.innerText = isCollapsed ? "▲" : "▼";
                }
            }
        }

        function showDataPanelTooltip(e) {
            let tt = document.getElementById("dataPanelTooltipHuge");
            if (!tt) {
                tt = document.createElement("div");
                tt.id = "dataPanelTooltipHuge";
                tt.className = "large-directive-tooltip";
                document.body.appendChild(tt);
            }

            const state = window.state;
            const foodVal = (state && typeof state.food === 'number') ? state.food : 30;
            const foodProd = (state && typeof state.foodProduction === 'number') ? state.foodProduction : 10;
            const woodVal = (state && typeof state.wood === 'number') ? state.wood : 30;
            const woodProd = (state && typeof state.woodProduction === 'number') ? state.woodProduction : 10;
            const defVal = (state && typeof state.defense === 'number') ? state.defense : 10;
            const mysticVal = (state && typeof state.mystic === 'number') ? state.mystic : 0;
            const mysticProd = (state && typeof state.mysticProduction === 'number') ? state.mysticProduction : 1;

            tt.innerHTML = `
                <div style="font-size:20px; font-weight:900; color:#1abc9c; margin-bottom:12px; border-bottom:1.5px solid #2a2e3d; padding-bottom:8px; display:flex; align-items:center; gap:8px;">
                    <span>📊</span> 各資源・産出データブレイクダウン
                </div>

                <div style="background:rgba(24, 34, 50, 0.7); border:1px solid #2c3e50; border-radius:8px; padding:12px 14px; margin-bottom:10px; display:flex; flex-direction:column; gap:6px;">
                    <div style="font-size:16.5px; font-weight:900; color:#ffffff; display:flex; justify-content:space-between;">
                        <span>🌾 食料 (Food)</span>
                        <span style="color:#2ecc71;">${foodVal} (+${foodProd}/T)</span>
                    </div>
                    <div style="font-size:14.5px; color:#a4b0be; display:flex; justify-content:space-between; padding-left:10px;">
                        <span>・ 本営基礎産出</span>
                        <span style="color:#2ecc71; font-weight:bold;">+10 / ターン</span>
                    </div>
                    <div style="font-size:14.5px; color:#a4b0be; display:flex; justify-content:space-between; padding-left:10px;">
                        <span>・ 土地・施設算定</span>
                        <span style="color:#2ecc71; font-weight:bold;">+0 / ターン</span>
                    </div>
                </div>

                <div style="background:rgba(24, 34, 50, 0.7); border:1px solid #2c3e50; border-radius:8px; padding:12px 14px; margin-bottom:10px; display:flex; flex-direction:column; gap:6px;">
                    <div style="font-size:16.5px; font-weight:900; color:#ffffff; display:flex; justify-content:space-between;">
                        <span>🧱 資材 (Wood)</span>
                        <span style="color:#2ecc71;">${woodVal} (+${woodProd}/T)</span>
                    </div>
                    <div style="font-size:14.5px; color:#a4b0be; display:flex; justify-content:space-between; padding-left:10px;">
                        <span>・ 本営基礎産出</span>
                        <span style="color:#2ecc71; font-weight:bold;">+10 / ターン</span>
                    </div>
                </div>

                <div style="background:rgba(24, 34, 50, 0.7); border:1px solid #2c3e50; border-radius:8px; padding:12px 14px; margin-bottom:10px; display:flex; flex-direction:column; gap:6px;">
                    <div style="font-size:16.5px; font-weight:900; color:#ffffff; display:flex; justify-content:space-between;">
                        <span>🛡️ 防衛 (Defense)</span>
                        <span style="color:#ffffff;">${defVal}</span>
                    </div>
                    <div style="font-size:14.5px; color:#a4b0be; display:flex; justify-content:space-between; padding-left:10px;">
                        <span>・ 本営初期防衛力</span>
                        <span style="color:#ffffff;">10</span>
                    </div>
                </div>

                <div style="background:rgba(24, 34, 50, 0.7); border:1px solid #2c3e50; border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:6px;">
                    <div style="font-size:16.5px; font-weight:900; color:#ffffff; display:flex; justify-content:space-between;">
                        <span>✨ 神秘 (Mystic)</span>
                        <span style="color:#2ecc71;">${mysticVal} (+${mysticProd}/T)</span>
                    </div>
                    <div style="font-size:14.5px; color:#a4b0be; display:flex; justify-content:space-between; padding-left:10px;">
                        <span>・ 本営基礎神秘力</span>
                        <span style="color:#2ecc71; font-weight:bold;">+1 / ターン</span>
                    </div>
                </div>
            `;

            const rect = e.currentTarget.getBoundingClientRect();
            tt.style.position = "fixed";
            tt.style.top = `${rect.bottom + 8}px`;
            tt.style.right = `${window.innerWidth - rect.right}px`;
            tt.style.display = "block";
        }

        function hideDataPanelTooltip() {
            const tt = document.getElementById("dataPanelTooltipHuge");
            if (tt) tt.style.display = "none";
        }

        window.showDataPanelTooltip = showDataPanelTooltip;
        window.hideDataPanelTooltip = hideDataPanelTooltip;
    </script>
</body>
</html>
