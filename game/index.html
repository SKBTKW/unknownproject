<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial of Ages : Last Ember</title>
    <link rel="stylesheet" href="css/0_global_common/global_animations.css?v=20260827_v38">
    <link rel="stylesheet" href="css/0_global_common/typography_theme.css?v=20260827_v38">
    <link rel="stylesheet" href="css/0_global_common/base_layout.css?v=20260909_v40">
    <link rel="stylesheet" href="css/0_global_common/build_identity_badge.css?v=20260905_v2">
    <link rel="stylesheet" href="css/0_global_common/dev_chronicle_restore.css">
    <link rel="stylesheet" href="css/1_top_header/top_header.css?v=20260909_v39">
    <link rel="stylesheet" href="css/2_center_area/land_grid.css?v=20260909_v39">
    <link rel="stylesheet" href="css/3_bottom_area/draw_card_select_area.css?v=20260827_v38">
    <link rel="stylesheet" href="css/3_bottom_area/player_tray_view_mode.css?v=20260912_v1">
    <link rel="stylesheet" href="css/3_bottom_area/trial_action_tray.css?v=20260912_v1">
    <link rel="stylesheet" href="css/4_right_sidebar/right_sidebar.css?v=20260827_v38">
    <link rel="stylesheet" href="css/4_right_sidebar/advisor_ui.css?v=20260909_v6">
    <link rel="stylesheet" href="css/layout.css?v=20260827_v38">
</head>
<body>

    <div class="app-wrapper">
        <!-- 🌌 ゲーム背景ウォールペーパーアート -->
        <div class="game-wallpaper-art" id="gameWallpaperArt">
            <img src="assets/title_logo.png" alt="THE AGE OF TRIALS" class="wallpaper-logo-img">
        </div>

        <!-- 1. Top Header Bar -->
        <div class="top-bar">
            <!-- 左端ロールアイコンはモック調整のため一旦撤去 -->
            <div class="header-resource-data-panel" id="headerDataPanel" data-tooltip="DATA_PANEL_BREAKDOWN" data-tooltip-title="UI_BREAKDOWN_MODAL_TITLE">
                <div class="header-data-item">
                    <span class="icon">🌾</span>
                    <span class="val" id="valFood">30</span>
                    <span class="prod">(<span id="valFoodProd">+12</span>/T)</span>
                </div>
                <div class="header-data-divider"></div>
                <div class="header-data-item">
                    <span class="icon">🧱</span>
                    <span class="val" id="valWood">30</span>
                    <span class="prod">(<span id="valWoodProd">+12</span>/T)</span>
                </div>
                <div class="header-data-divider"></div>
                <div class="header-data-item">
                    <span class="icon">🛡️</span>
                    <span class="val" id="valDefense">10 / 10</span>
                </div>
                <div class="header-data-divider"></div>
                <div class="header-data-item">
                    <span class="icon">✨</span>
                    <span class="val" id="valMystic">0</span>
                    <span class="prod">(<span id="valMysticProd">+3</span>/T)</span>
                </div>
            </div>
        </div>

        <!-- 🕹️ 2. Middle Board Area -->
        <div class="middle-layout">
            <div id="layerWorldBoard" class="layer-world-board layer-world-board-container">
                <div class="board-container-wrapper board-wrapper-anchor">
                    <div id="buffComponentContainer"></div>
                    <div class="grid-board-anchor grid-anchor-box">
                        <div id="gridBoard" class="grid-with-headers"></div>
                    </div>
                </div>
            </div>

            <div id="layerPlayerTray" class="layer-player-tray layer-player-tray-anchor">
                <div class="offering-section pointer-events-auto">
                    <div id="cardFloatingPreview" class="card-floating-preview-container"></div>
                    <div id="cardRow" class="cards-row-wrapper"></div>
                </div>
                <div id="trialActionTrayHost" class="trial-action-tray-host" aria-hidden="true"></div>
            </div>

            <div id="layerSystemOverlay" class="layer-system-overlay layer-system-overlay-anchor">
                <!-- ログUIは一旦非表示。LogComponent自体はコード側に保持 -->
                <div id="bgTurnWatermark" class="bg-turn-watermark">
                    <div class="bg-turn-label">verse</div>
                    <div class="bg-turn-num"><span id="valTurnBg">01</span><small>/50</small></div>
                    <div id="trialCountdownBadge" class="trial-countdown-badge" style="display:none;">
                        <span data-i18n="UI_TRIAL_COUNTDOWN_PREFIX"></span> <strong id="valTrialCountdown" class="trial-countdown-val"></strong> <span data-i18n="UI_TRIAL_COUNTDOWN_SUFFIX"></span>
                    </div>
                </div>

                <div id="cardRotateCursorTooltip" class="card-rotate-cursor-tooltip"></div>
                <div id="cardHoverPreviewModal" class="card-hover-preview-modal-box">
                    <div id="cardHoverPreviewContent" class="card-hover-preview-content-box"></div>
                </div>
            </div>
        </div>

        <!-- AdvisorはSystemOverlay外へ出し、手札より下層で独立管理 -->
        <div id="advisorDockContainer"></div>
    </div>

    <div id="directiveModal" class="directive-modal-overlay">
        <div class="directive-modal-window">
            <div class="directive-modal-header">
                <h3 class="directive-modal-title">
                    <span>🏛️</span> <span data-i18n="UI_DIRECTIVE_MODAL_TITLE"></span>
                </h3>
                <span class="directive-modal-close" onclick="closeDirectiveModal()">✕</span>
            </div>
            <div class="directive-modal-desc" data-i18n="UI_DIRECTIVE_MODAL_DESC"></div>
            <div class="directive-options-container" id="directiveOptions"></div>
            <div class="directive-modal-footer">
                <button class="directive-cancel-btn" onclick="closeDirectiveModal()" data-i18n="UI_CANCEL"></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { GameEngine, UIController, UndoLandSystem, BuffSystem, TerritoryBadgeComponent, ModalSystem, FocusLayerManager, BoardCameraSystem, SettingsModalSystem, settingsModalInstance, gameSettings, EmberStatusComponent, HandCardsComponent, ReserveSlotComponent, TopHeaderComponent, BoardGridComponent, HqComponent, TooltipSystem, tooltipSystemInstance, EmberSystem } from './src/app.js?v=20260909_v53';
        import { attachTrialActionTray } from './src/ui/trial_action_tray_runtime_bridge.js?v=20260913_v1';

        function bootstrap() {
            try {
                const engine = GameEngine.createGame();
                const ui = new UIController(engine);
                attachTrialActionTray(ui);

                window.gameEngine = engine;
                window.ui = ui;

                if (UndoLandSystem && ui.state) {
                    window.undoSys = new UndoLandSystem(ui.state);
                }

                ui.init();
            } catch (err) {
                console.error("🔥 [Bootstrap Error]", err);
                const errBox = document.createElement("div");
                errBox.style.cssText = "position:fixed; top:20px; left:20px; z-index:99999; background:rgba(180,0,0,0.9); color:#fff; padding:16px; border-radius:8px; font-family:monospace; font-size:14px; max-width:80%;";
                errBox.innerHTML = `<strong>Launch Error:</strong><br>${err.message}<br><pre style="white-space:pre-wrap; font-size:12px; margin-top:8px;">${err.stack}</pre>`;
                document.body.appendChild(errBox);
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", bootstrap);
        } else {
            bootstrap();
        }
    </script>
</body>
</html>
