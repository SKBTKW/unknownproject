<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Turn Box Placement Proposals</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0e14; color: #fff; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .top-bar { height: 60px; background: #161922; border-bottom: 1px solid #2a2e3d; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
        .app-title { font-size: 15px; font-weight: bold; }
        .btn-log { background: rgba(42, 46, 61, 0.85); color: #1abc9c; border: 1px solid #2c3e50; padding: 1px 8px; font-size: 11px; border-radius: 4px; }
        .ember-box { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 900; color: #f1c40f; }
        .resource-box { background: rgba(24, 34, 50, 0.9); border: 1px solid #2c3e50; border-radius: 6px; padding: 4px 12px; font-size: 12px; display: flex; gap: 12px; }

        .main-layout { flex: 1; display: flex; }
        .board-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #0f141d; }
        .grid-mock { width: 280px; height: 280px; background: #182232; border-radius: 8px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px; }
        .cell { background: #2c3e50; border-radius: 4px; }
        .cell.hq { background: #1abc9c; }

        .right-sidebar { width: 240px; background: #121620; border-left: 1px solid #1e2538; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .sidebar-card { background: #182232; border: 1px solid #2a2e3d; border-radius: 8px; padding: 12px; }

        /* 💡 案A: TURN END 直上のターン数バッジ */
        .turn-box-proposal-a {
            background: linear-gradient(135deg, rgba(26, 188, 156, 0.2) 0%, rgba(22, 160, 133, 0.3) 100%);
            border: 1.5px solid #1abc9c;
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(26, 188, 156, 0.2);
            margin-top: auto;
        }
        .turn-label-a { font-size: 10px; color: #1abc9c; font-weight: bold; letter-spacing: 1px; }
        .turn-num-a { font-size: 18px; font-weight: 900; color: #ffffff; }

        .btn-action { padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; }
        .btn-mulligan { background: #e74c3c; color: white; }
        .btn-turnend { background: #1abc9c; color: #0b0e14; font-size: 14px; font-weight: 900; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <div class="app-title">Trial of Ages : Last Ember 👤</div>
            <button class="btn-log">📜 ログ ▽</button>
        </div>
        <div class="ember-box">🔥 : 20</div>
        <div class="resource-box">
            <span>🌾 食料: 30 (+10/T)</span>
            <span>🧱 資材: 30 (+10/T)</span>
            <span>🛡️ 防衛: 10</span>
            <span>✨ 神秘: 0 (+1/T)</span>
        </div>
    </div>

    <div class="main-layout">
        <div class="board-area">
            <div class="grid-mock">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell hq"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
            </div>
        </div>

        <div class="right-sidebar">
            <div class="sidebar-card">
                <div style="font-size:11px; font-weight:bold; color:#1abc9c;">📥 保留エリア (0/3)</div>
                <div style="font-size:10px; color:#7f8c8d; padding:12px; text-align:center;">空枠 1</div>
            </div>

            <!-- 💡 案A: TURN END ボタン直上のターン表示 -->
            <div class="turn-box-proposal-a">
                <div class="turn-label-a">⌛ CURRENT TURN</div>
                <div class="turn-num-a">1 <span style="font-size:12px; color:#a4b0be; font-weight:normal;">/ 50</span></div>
            </div>

            <div class="btn-action btn-mulligan">力尽きる前に行動: 🔥-1</div>
            <div class="btn-action btn-turnend">TURN END ➔</div>
        </div>
    </div>

</body>
</html>
