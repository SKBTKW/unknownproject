<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Streamlined Sidebar & Integrated Bottom-Right Controls Sandbox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header-bar {
            height: 72px;
            background: #121620;
            border-bottom: 1.5px solid #1e2538;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .board-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f141d;
        }
        .grid-mock {
            width: 300px;
            height: 300px;
            background: #182232;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            padding: 8px;
        }
        .grid-cell { background: #2c3e50; border-radius: 4px; }
        .grid-cell.hq { background: #1abc9c; }

        /* 📊 右サイドバー (パーティション解除・フラットデザイン) */
        .right-sidebar-flat {
            width: 260px;
            background: #121620;
            border-left: 1.5px solid #1e2538;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .reserve-section-flat {
            padding: 12px;
        }
        .reserve-title {
            font-size: 13px;
            font-weight: bold;
            color: #1abc9c;
            margin-bottom: 10px;
        }

        /* 💡 右下隅: 統合操作パネル枠 (ターン表示・マリガン・TURN END) */
        .sidebar-bottom-controls-partition {
            background: rgba(24, 34, 50, 0.95);
            border: 1.5px solid #2c3e50;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }

        .turn-box-inside {
            background: rgba(26, 188, 156, 0.15);
            border: 1px solid #1abc9c;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
        }
        .turn-label {
            font-size: 10px;
            font-weight: bold;
            color: #1abc9c;
            letter-spacing: 1px;
        }
        .turn-val {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
        }

        .btn-action {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .btn-mulligan {
            background: #e74c3c;
            color: #ffffff;
        }
        .btn-mulligan:hover { background: #c0392b; }

        .btn-turnend {
            background: #1abc9c;
            color: #0b0e14;
            font-size: 14px;
            font-weight: 900;
        }
        .btn-turnend:hover { background: #16a085; color: #ffffff; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div style="font-size:15px; font-weight:bold;">Trial of Ages : Last Ember 👤</div>
        <div style="font-size:22px; font-weight:900; color:#f1c40f;">🔥 : 20</div>
    </div>

    <div class="main-layout">
        <div class="board-center">
            <div class="grid-mock">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell hq"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
        </div>

        <!-- 📊 右サイドバー (パーティション解除 ＋ 右下統合操作枠) -->
        <div class="right-sidebar-flat">
            <div class="reserve-section-flat">
                <div class="reserve-title">📥 保留エリア (0/3)</div>
                <div style="font-size:11px; color:#7f8c8d; text-align:center; padding:16px; border:1px dashed #2c3e50; border-radius:6px;">空枠 1</div>
            </div>

            <!-- 💡 右下隅: 統合操作パネル枠 (ターン表示 ＋ マリガン ＋ TURN END) -->
            <div class="sidebar-bottom-controls-partition" id="integratedControlsPartition">
                <div class="turn-box-inside">
                    <div class="turn-label">⌛ ターン表示</div>
                    <div class="turn-val">1 <span style="font-size:12px; color:#a4b0be; font-weight:normal;">/ 50</span></div>
                </div>
                <button class="btn-action btn-mulligan">マリガン : 🔥 -1</button>
                <button class="btn-action btn-turnend">TURN END ➔</button>
            </div>
        </div>
    </div>

</body>
</html>
