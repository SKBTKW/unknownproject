<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3-Tier Horizontal Partition Layout Sandbox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 👑 1. 最上部ヘッダー (高さ 84px ✕ 上段パーティション) */
        .header-bar-master {
            height: 84px;
            background: #121620;
            border-bottom: 1.5px solid #1e2538;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            z-index: 1000;
            flex-shrink: 0;
        }

        .header-left-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 10;
        }
        .app-title { font-size: 16px; font-weight: bold; }
        .btn-log-toggle {
            margin-top: 3px;
            background: rgba(42, 46, 61, 0.85);
            color: #1abc9c;
            border: 1px solid #2c3e50;
            border-radius: 4px;
            padding: 1px 8px;
            font-size: 11px;
            font-weight: bold;
        }

        .ember-center-box-master {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 38px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 18px rgba(241, 196, 15, 0.6);
            z-index: 10;
        }

        .header-data-panel-master {
            margin-left: auto;
            background: rgba(24, 34, 50, 0.95);
            border: 1.5px solid #2c3e50;
            border-radius: 8px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .data-item-master { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 900; }
        .data-item-master .label { color: #a4b0be; font-size: 12px; }
        .data-item-master .val { color: #ffffff; font-size: 16px; }
        .data-item-master .prod { color: #2ecc71; font-size: 11.5px; }

        /* 🕹️ 2. 中央メインエリア (縦分割なし・開放型中段パーティション) */
        .middle-board-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f141d;
            position: relative;
        }
        .grid-mock {
            width: 320px;
            height: 320px;
            background: #182232;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            padding: 8px;
        }
        .grid-cell { background: #2c3e50; border-radius: 4px; }
        .grid-cell.hq { background: #1abc9c; }

        /* 🃏 3. 最下部フッター (下段統合パーティション: ドロー・保留・操作) */
        .bottom-footer-container {
            background: #121620;
            border-top: 1.5px solid #1e2538;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-shrink: 0;
        }

        .cards-group-box {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
        }

        .offering-subgroup, .reserve-subgroup {
            background: #182232;
            border: 1px solid #2a2e3d;
            border-radius: 8px;
            padding: 10px;
        }
        .offering-subgroup { flex: 2; }
        .reserve-subgroup { flex: 1; }

        .subgroup-title {
            font-size: 12px;
            font-weight: bold;
            color: #1abc9c;
            margin-bottom: 8px;
        }

        .cards-row-mock {
            display: flex;
            gap: 8px;
        }
        .card-mock {
            width: 80px;
            height: 110px;
            background: #2c3e50;
            border-radius: 6px;
            border: 1px solid #34495e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        /* 🎮 フッター右端: 統合操作・ターン表示枠 */
        .footer-controls-partition {
            width: 220px;
            background: rgba(24, 34, 50, 0.95);
            border: 1.5px solid #2c3e50;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }

        .turn-box-inside {
            background: rgba(26, 188, 156, 0.15);
            border: 1px solid #1abc9c;
            border-radius: 6px;
            padding: 4px;
            text-align: center;
        }
        .turn-label { font-size: 10px; font-weight: bold; color: #1abc9c; }
        .turn-val { font-size: 16px; font-weight: 900; color: #ffffff; }

        .btn-action {
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
        }
        .btn-mulligan { background: #e74c3c; color: white; }
        .btn-turnend { background: #1abc9c; color: #0b0e14; font-size: 13px; font-weight: 900; }
    </style>
</head>
<body>

    <!-- 👑 1. ヘッダー (上段パーティション) -->
    <div class="header-bar-master">
        <div class="header-left-box">
            <div class="app-title">Trial of Ages : Last Ember 👤</div>
            <button class="btn-log-toggle">📜 ログ ▽</button>
        </div>

        <div class="ember-center-box-master">
            <span>🔥</span>
            <span>: 20</span>
        </div>

        <div class="header-data-panel-master">
            <div class="data-item-master">
                <span>🌾</span>
                <span class="label">食料:</span>
                <span class="val">30</span>
                <span class="prod">(+10/T)</span>
            </div>
            <div style="width:1px; height:16px; background:#2c3e50;"></div>
            <div class="data-item-master">
                <span>🧱</span>
                <span class="label">資材:</span>
                <span class="val">30</span>
                <span class="prod">(+10/T)</span>
            </div>
            <div style="width:1px; height:16px; background:#2c3e50;"></div>
            <div class="data-item-master">
                <span>🛡️</span>
                <span class="label">防衛:</span>
                <span class="val">10</span>
            </div>
            <div style="width:1px; height:16px; background:#2c3e50;"></div>
            <div class="data-item-master">
                <span>✨</span>
                <span class="label">神秘:</span>
                <span class="val">0</span>
                <span class="prod">(+1/T)</span>
            </div>
        </div>
    </div>

    <!-- 🕹️ 2. メインエリア (中段パーティション: 縦分割破棄) -->
    <div class="middle-board-area">
        <div class="grid-mock">
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell hq"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
    </div>

    <!-- 🃏 3. フッター (下段統合パーティション) -->
    <div class="bottom-footer-container">
        <div class="cards-group-box">
            <div class="offering-subgroup">
                <div class="subgroup-title">🂠 手札オファリング</div>
                <div class="cards-row-mock">
                    <div class="card-mock">草原</div>
                    <div class="card-mock">森</div>
                    <div class="card-mock">丘陵</div>
                </div>
            </div>

            <div class="reserve-subgroup">
                <div class="subgroup-title">📥 保留エリア (0/3)</div>
                <div class="cards-row-mock">
                    <div class="card-mock" style="border-style:dashed;">空枠 1</div>
                </div>
            </div>
        </div>

        <!-- 🎮 フッター右端: ターン表示 ＋ マリガン ＋ TURN END 統合枠 -->
        <div class="footer-controls-partition" id="footerControlsPartition">
            <div class="turn-box-inside">
                <div class="turn-label">⌛ ターン表示</div>
                <div class="turn-val">1 <span style="font-size:11px; color:#a4b0be;">/ 50</span></div>
            </div>
            <button class="btn-action btn-mulligan">力尽きる前に行動: 🔥 -1</button>
            <button class="btn-action btn-turnend">TURN END ➔</button>
        </div>
    </div>

</body>
</html>
