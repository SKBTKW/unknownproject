<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>4x Data Panel Font Size & Hide Directive Badge Sandbox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 👑 最上部ヘッダーバー (高さも大型フォントに合わせて拡張: 90px) */
        .header-bar {
            height: 90px;
            background: #121620;
            border-bottom: 1.5px solid #1e2538;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
            z-index: 1000;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .app-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
        }

        .btn-log-toggle-header {
            margin-top: 2px;
            background: rgba(42, 46, 61, 0.85);
            color: #1abc9c;
            border: 1px solid #2c3e50;
            border-radius: 4px;
            padding: 1px 8px;
            font-size: 11px;
            font-weight: bold;
        }

        /* 🔥 中央: 残り火 4倍拡大 ＆ 画面真中央センタリング (方針バッジ停止 display:none) */
        .ember-center-box-4x {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 44px; /* 4倍級拡大 */
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 16px rgba(241, 196, 15, 0.5);
        }
        .directive-badge-hidden {
            display: none !important; /* 一旦表示を停止 */
        }

        /* 📊 ヘッダー右側: 各種データ表示パネル (文字サイズ 4倍拡大) */
        .header-data-panel-4x {
            background: rgba(24, 34, 50, 0.95);
            border: 2px solid #2c3e50;
            border-radius: 10px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            /* 4倍級大フォント設定 */
            font-size: 28px;
            font-weight: 900;
        }
        .header-data-panel-4x .data-item-4x {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-data-panel-4x .label-4x { color: #a4b0be; font-size: 24px; }
        .header-data-panel-4x .val-4x { color: #ffffff; font-size: 32px; }
        .header-data-panel-4x .prod-4x { color: #2ecc71; font-size: 22px; }
        .divider-4x { width: 2px; height: 32px; background: #2c3e50; }

        /* 🕹️ メインレイアウト */
        .main-layout {
            flex: 1;
            display: flex;
            background: #0f141d;
        }
        .board-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .grid-mock {
            width: 280px;
            height: 280px;
            background: #182232;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            padding: 8px;
        }
        .grid-cell { background: #2c3e50; border-radius: 4px; }
        .grid-cell.hq { background: #1abc9c; }
    </style>
</head>
<body>

    <!-- 👑 ヘッダー (4倍大データパネル ＋ 方針バッジ停止) -->
    <div class="header-bar">
        <div class="header-left">
            <div class="app-title">Trial of Ages : Last Ember</div>
            <button class="btn-log-toggle-header">📜 ログ ▽</button>
        </div>

        <!-- 🔥 画面真中央 4倍拡大残り火 (方針バッジ停止) -->
        <div class="ember-center-box-4x">
            <span style="font-size:48px;">🔥</span>
            <span>: 20</span>
            <div class="directive-badge-hidden">🚩 開拓方針 ℹ️</div>
        </div>

        <!-- 📊 ヘッダー右側: 各種データ表示パネル (文字サイズ 4倍拡大) -->
        <div class="header-data-panel-4x" id="headerDataPanel4x">
            <div class="data-item-4x">
                <span style="font-size:32px;">🌾</span>
                <span class="label-4x">食料:</span>
                <span class="val-4x">30</span>
                <span class="prod-4x">(+10/T)</span>
            </div>
            <div class="divider-4x"></div>
            <div class="data-item-4x">
                <span style="font-size:32px;">🧱</span>
                <span class="label-4x">資材:</span>
                <span class="val-4x">30</span>
                <span class="prod-4x">(+10/T)</span>
            </div>
            <div class="divider-4x"></div>
            <div class="data-item-4x">
                <span style="font-size:32px;">🛡️</span>
                <span class="label-4x">防衛:</span>
                <span class="val-4x">10</span>
            </div>
            <div class="divider-4x"></div>
            <div class="data-item-4x">
                <span style="font-size:32px;">✨</span>
                <span class="label-4x">神秘:</span>
                <span class="val-4x">0</span>
                <span class="prod-4x">(+1/T)</span>
            </div>
        </div>
    </div>

    <!-- 🕹️ メインコンテナ -->
    <div class="main-layout">
        <div class="board-center">
            <div class="grid-mock">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell hq"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
        </div>
    </div>

</body>
</html>
