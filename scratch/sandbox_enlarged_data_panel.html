<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Enlarged Resource Data Panel & Huge Tooltip Sandbox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 👑 最上部ヘッダー (高さ 84px) */
        .header-bar-master {
            height: 84px;
            background: #121620;
            border-bottom: 1.5px solid #1e2538;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            z-index: 1000;
        }

        .header-left-box { display: flex; flex-direction: column; }
        .app-title { font-size: 16px; font-weight: bold; }
        .btn-log-toggle {
            margin-top: 3px;
            background: rgba(42, 46, 61, 0.85);
            color: #1abc9c;
            border: 1px solid #2c3e50;
            border-radius: 4px;
            padding: 1px 8px;
            font-size: 11px;
            font-weight: bold;
        }

        .ember-center-box-master {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 38px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 18px rgba(241, 196, 15, 0.6);
        }

        /* 📊 1. 常時表示: 限界超大型拡大データパネル (日本語テキスト排除 ✕ アイコン＋数値特大) */
        .header-resource-data-panel-huge {
            margin-left: auto;
            background: rgba(24, 34, 50, 0.95);
            border: 2px solid #2c3e50;
            border-radius: 10px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.6);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            position: relative;
        }
        .header-resource-data-panel-huge:hover {
            border-color: #1abc9c;
            box-shadow: 0 6px 24px rgba(26,188,156,0.5);
            background: rgba(30, 42, 62, 0.98);
        }

        .huge-data-item {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .huge-data-item .icon { font-size: 28px; line-height: 1; }
        .huge-data-item .val { font-size: 24px; font-weight: 900; color: #ffffff; }
        .huge-data-item .prod { font-size: 15px; font-weight: 900; color: #2ecc71; }
        .divider-huge { width: 1.5px; height: 26px; background: #2c3e50; }

        /* 🔍 2. マウスオーバー時: 超大スケール詳細ブレイクダウンツールチップ (見出し20px / 本文16px) */
        .data-panel-tooltip-huge {
            position: absolute;
            top: 76px;
            right: 0;
            width: 440px;
            background: rgba(15, 20, 29, 0.98);
            border: 2px solid #1abc9c;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.95), 0 0 25px rgba(26,188,156,0.3);
            backdrop-filter: blur(12px);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: tooltipFadeIn 0.15s ease-out forwards;
        }
        @keyframes tooltipFadeIn {
            0% { opacity: 0; transform: translateY(-8px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .tooltip-header-title {
            font-size: 20px;
            font-weight: 900;
            color: #1abc9c;
            border-bottom: 1.5px solid #2a2e3d;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tooltip-resource-section {
            background: rgba(24, 34, 50, 0.7);
            border: 1px solid #2c3e50;
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .tooltip-resource-title {
            font-size: 16.5px;
            font-weight: 900;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tooltip-detail-line {
            font-size: 14.5px;
            color: #a4b0be;
            display: flex;
            justify-content: space-between;
            padding-left: 10px;
        }
        .tooltip-detail-line .val-green { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 👑 最上部ヘッダー -->
    <div class="header-bar-master">
        <div class="header-left-box">
            <div class="app-title">Trial of Ages : Last Ember 👤</div>
            <button class="btn-log-toggle">📜 ログ ▽</button>
        </div>

        <div class="ember-center-box-master">
            <span>🔥</span>
            <span>: 20</span>
        </div>

        <!-- 📊 1. 常時表示: 限界超大型拡大データパネル (文字なし ✕ アイコン＋数値特大) -->
        <div class="header-resource-data-panel-huge" id="headerDataPanelHuge">
            <div class="huge-data-item">
                <span class="icon">🌾</span>
                <span class="val">30</span>
                <span class="prod">(+10/T)</span>
            </div>
            <div class="divider-huge"></div>
            <div class="huge-data-item">
                <span class="icon">🧱</span>
                <span class="val">30</span>
                <span class="prod">(+10/T)</span>
            </div>
            <div class="divider-huge"></div>
            <div class="huge-data-item">
                <span class="icon">🛡️</span>
                <span class="val">10</span>
            </div>
            <div class="divider-huge"></div>
            <div class="huge-data-item">
                <span class="icon">✨</span>
                <span class="val">0</span>
                <span class="prod">(+1/T)</span>
            </div>

            <!-- 🔍 2. マウスオーバー時: 超特大スケール詳細ツールチップ (見出し20px / 本文16px) -->
            <div class="data-panel-tooltip-huge" id="dataPanelTooltipHuge">
                <div class="tooltip-header-title">
                    <span>📊</span> 各資源・産出データブレイクダウン
                </div>

                <div class="tooltip-resource-section">
                    <div class="tooltip-resource-title">
                        <span>🌾 食料 (Food)</span>
                        <span style="color:#2ecc71;">30 (+10/T)</span>
                    </div>
                    <div class="tooltip-detail-line">
                        <span>・ 本営基礎産出</span>
                        <span class="val-green">+10 / ターン</span>
                    </div>
                    <div class="tooltip-detail-line">
                        <span>・ 土地・施設産出</span>
                        <span class="val-green">+0 / ターン</span>
                    </div>
                </div>

                <div class="tooltip-resource-section">
                    <div class="tooltip-resource-title">
                        <span>🧱 資材 (Wood)</span>
                        <span style="color:#2ecc71;">30 (+10/T)</span>
                    </div>
                    <div class="tooltip-detail-line">
                        <span>・ 本営基礎産出</span>
                        <span class="val-green">+10 / ターン</span>
                    </div>
                </div>

                <div class="tooltip-resource-section">
                    <div class="tooltip-resource-title">
                        <span>🛡️ 防衛 (Defense)</span>
                        <span style="color:#ffffff;">10</span>
                    </div>
                    <div class="tooltip-detail-line">
                        <span>・ 本営初期防衛力</span>
                        <span style="color:#ffffff;">10</span>
                    </div>
                </div>

                <div class="tooltip-resource-section">
                    <div class="tooltip-resource-title">
                        <span>✨ 神秘 (Mystic)</span>
                        <span style="color:#2ecc71;">0 (+1/T)</span>
                    </div>
                    <div class="tooltip-detail-line">
                        <span>・ 本営基礎神秘力</span>
                        <span class="val-green">+1 / ターン</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🕹️ メイン盤面エリア -->
    <div style="flex:1; background:#0f141d; display:flex; align-items:center; justify-content:center;">
        <div style="color:#7f8c8d; font-size:14px;">[ 盤面エリア全幅 100% ]</div>
    </div>

</body>
</html>
