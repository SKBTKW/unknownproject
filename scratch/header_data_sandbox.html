<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Header Data Panel Layout Sandbox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 👑 最上部ヘッダーバー */
        .header-bar {
            height: 64px;
            background: #121620;
            border-bottom: 1px solid #1e2538;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: relative;
            z-index: 1000;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .app-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
        }

        .btn-log-toggle-header {
            margin-top: 2px;
            background: rgba(42, 46, 61, 0.85);
            color: #1abc9c;
            border: 1px solid #2c3e50;
            border-radius: 4px;
            padding: 1px 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 🔥 中央: 残り火 ＆ 方針バッジ */
        .ember-center-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
        }
        .ember-val {
            font-size: 20px;
            font-weight: 900;
            color: #f1c40f;
        }
        .directive-pill {
            background: #1e4a26;
            color: #2ecc71;
            border: 1px solid #2ecc71;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 9.5px;
            font-weight: bold;
        }

        /* 📊 ヘッダー中央右: 横一列データ表示パネル */
        .header-data-panel {
            background: rgba(24, 34, 50, 0.9);
            border: 1px solid #2c3e50;
            border-radius: 8px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .data-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .data-item .label { color: #a4b0be; font-size: 11px; }
        .data-item .val { color: #ffffff; }
        .data-item .prod { color: #2ecc71; font-size: 10px; }

        /* ターン表示 */
        .turn-box {
            background: #1abc9c;
            color: #0b0e14;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            text-align: center;
        }

        /* 🕹️ メインコンテナ */
        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .board-center-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f141d;
        }

        .grid-mock {
            width: 300px;
            height: 300px;
            background: #182232;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            padding: 8px;
        }
        .grid-cell { background: #2c3e50; border-radius: 4px; }
        .grid-cell.hq { background: #1abc9c; }

        /* 📊 右サイドバー (保留 ＆ ボタンのみ) */
        .right-sidebar {
            width: 220px;
            background: #121620;
            border-left: 1px solid #1e2538;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-card {
            background: #182232;
            border: 1px solid #2a2e3d;
            border-radius: 8px;
            padding: 12px;
        }
        .sidebar-title {
            font-size: 12px;
            font-weight: bold;
            color: #1abc9c;
            margin-bottom: 8px;
            border-bottom: 1px solid #2a2e3d;
            padding-bottom: 4px;
        }

        .action-btns {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-action {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-mulligan { background: #e74c3c; color: white; }
        .btn-turnend { background: #1abc9c; color: #0b0e14; }
    </style>
</head>
<body>

    <!-- 👑 ヘッダー (データ表示パネル統合) -->
    <div class="header-bar">
        <div class="header-left">
            <div class="app-title">Trial of Ages : Last Ember</div>
            <button class="btn-log-toggle-header">📜 ログ ▽</button>
        </div>

        <div class="ember-center-box">
            <div class="ember-val">🔥 : 20</div>
            <div class="directive-pill">🚩 開拓方針 ℹ️</div>
        </div>

        <!-- 📊 ヘッダー中央右: 各種データ表示パネル (横一列) -->
        <div class="header-data-panel" id="headerDataPanel">
            <div class="data-item">
                <span>🌾</span>
                <span class="label">食料:</span>
                <span class="val">30</span>
                <span class="prod">(+10/T)</span>
            </div>
            <div style="width:1px; height:14px; background:#2c3e50;"></div>
            <div class="data-item">
                <span>🧱</span>
                <span class="label">資材:</span>
                <span class="val">30</span>
                <span class="prod">(+10/T)</span>
            </div>
            <div style="width:1px; height:14px; background:#2c3e50;"></div>
            <div class="data-item">
                <span>🛡️</span>
                <span class="label">防衛:</span>
                <span class="val">10</span>
            </div>
            <div style="width:1px; height:14px; background:#2c3e50;"></div>
            <div class="data-item">
                <span>✨</span>
                <span class="label">神秘:</span>
                <span class="val">0</span>
                <span class="prod">(+1/T)</span>
            </div>
        </div>

        <div class="turn-box">
            <span style="font-size:10px;">ターン表示</span><br>1/50
        </div>
    </div>

    <!-- 🕹️ メインコンテナ -->
    <div class="main-layout">
        <div class="board-center-area">
            <div class="grid-mock">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell hq"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
        </div>

        <div class="right-sidebar">
            <div class="sidebar-card">
                <div class="sidebar-title">📥 保留エリア (0/3)</div>
                <div style="font-size:11px; color:#7f8c8d; text-align:center; padding:16px;">空枠 1</div>
            </div>

            <div class="action-btns">
                <button class="btn-action btn-mulligan">力尽きる前に行動: 🔥-1</button>
                <button class="btn-action btn-turnend">TURN END ➔</button>
            </div>
        </div>
    </div>

</body>
</html>
