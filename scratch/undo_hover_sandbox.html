<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Undo Hover Follow Cursor Sandbox</title>
    <style>
        body {
            background: #0f141d;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .grid-board {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            grid-template-rows: repeat(5, 60px);
            gap: 4px;
            background: #182232;
            padding: 10px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .cell {
            background: #2c3e50;
            border: 1px solid #34495e;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            cursor: pointer;
        }
        .cell.hq { background: #1abc9c; color: #111; font-weight: bold; }
        .cell.placed { background: #d35400; color: #fff; font-weight: bold; }
        .status-panel {
            background: #182232;
            padding: 12px 20px;
            border-radius: 6px;
            text-align: center;
            min-width: 320px;
        }
        button {
            padding: 8px 16px;
            background: #e67e22;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🖱️ マウス追従型 Undo UI 仮作業検証サンドボックス</h1>

    <div class="status-panel">
        <p id="resourceState">🌾 食料: 30 | 🧱 資材: 30</p>
        <p id="pickupState">配置状態: 未配置 (hasPicked: false)</p>
    </div>

    <div id="gridBoard" class="grid-board"></div>

    <button onclick="simulateNextTurn()">次ターンへ進む (TURN END)</button>

    <script src="undo_land_system.js"></script>
    <script>
        const fakeState = {
            turn: 1,
            food: 30,
            wood: 30,
            defense: 10,
            ember: 20,
            mystic: 0,
            hasPickedThisTurn: false,
            grid: Array(5).fill(0).map((_, r) => Array(5).fill(0).map((_, c) => ({ r, c, placed: (r===2&&c===2) }))),
            grantedConnectionPairs: new Set(),
            mergedBlocks: {},
            handOffering: [{ id: "card_plains_01", nameKey: "LAND_PLAINS_1X1" }, null, null],
            addLog: (msg) => console.log("LOG:", msg)
        };

        const undoSys = new UndoLandSystem(fakeState);

        function renderGrid() {
            const board = document.getElementById("gridBoard");
            board.innerHTML = "";

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    const cell = fakeState.grid[r][c];
                    const cellEl = document.createElement("div");
                    cellEl.className = `cell ${cell.r===2&&cell.c===2 ? 'hq' : (cell.placed ? 'placed' : '')}`;
                    cellEl.innerText = cell.r===2&&cell.c===2 ? "本営" : (cell.placed ? "草原" : `${r},${c}`);

                    cellEl.onmouseenter = (e) => {
                        undoSys.showHoverTooltip(e, r, c);
                    };
                    cellEl.onmousemove = (e) => {
                        undoSys.updateHoverTooltipPosition(e);
                    };
                    cellEl.onmouseleave = () => {
                        undoSys.hideHoverTooltip();
                    };

                    cellEl.onclick = () => {
                        if (undoSys.isCellPlacedThisTurn(r, c)) {
                            // 当ターンで置いたマスのクリック ➔ Undo 実行
                            undoSys.undo();
                            renderGrid();
                        } else if (!fakeState.hasPickedThisTurn && !(r===2&&c===2)) {
                            // 未配置マスのクリック ➔ 土地配置
                            undoSys.captureSnapshot([{ r, c }]);
                            cell.placed = true;
                            fakeState.food += 10;
                            fakeState.hasPickedThisTurn = true;
                            renderGrid();
                        }
                    };

                    board.appendChild(cellEl);
                }
            }

            document.getElementById("resourceState").innerText = `🌾 食料: ${fakeState.food} | 🧱 資材: ${fakeState.wood}`;
            document.getElementById("pickupState").innerText = `配置状態: ${fakeState.hasPickedThisTurn ? "配置完了 (当ターンマスへホバーでUndo表示)" : "未配置"}`;
        }

        function simulateNextTurn() {
            undoSys.clearSnapshot();
            fakeState.turn++;
            fakeState.hasPickedThisTurn = false;
            renderGrid();
        }

        renderGrid();
    </script>
</body>
</html>
