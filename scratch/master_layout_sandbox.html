<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Master Layout Sandbox - Final Precision Architecture</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 👑 1. 最上部ヘッダー (高さ 84px ✕ 完全視認最適化) */
        .header-bar-master {
            height: 84px;
            background: #121620;
            border-bottom: 1.5px solid #1e2538;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            z-index: 1000;
        }

        /* 左: タイトル ＆ ログボタン */
        .header-left-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            z-index: 10;
        }
        .app-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-log-toggle-header {
            margin-top: 3px;
            background: rgba(42, 46, 61, 0.85);
            color: #1abc9c;
            border: 1.5px solid #2c3e50;
            border-radius: 5px;
            padding: 2px 10px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 🔥 中央: 残り火 画面真中央センタリング (圧倒的巨大サイズ & 発光) */
        .ember-center-box-master {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 38px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 18px rgba(241, 196, 15, 0.6);
            z-index: 10;
            pointer-events: none;
        }

        /* 📊 右端: 各種データ表示パネル (右寄せ ＆ 拡大表示) */
        .header-data-panel-master {
            margin-left: auto;
            background: rgba(24, 34, 50, 0.95);
            border: 1.5px solid #2c3e50;
            border-radius: 8px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
            z-index: 10;
        }
        .data-item-master {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 15px;
            font-weight: 900;
            white-space: nowrap;
        }
        .data-item-master .label { color: #a4b0be; font-size: 13px; font-weight: bold; }
        .data-item-master .val { color: #ffffff; font-size: 18px; font-weight: 900; }
        .data-item-master .prod { color: #2ecc71; font-size: 12.5px; font-weight: bold; }
        .divider-master { width: 1px; height: 18px; background: #2c3e50; }

        /* 🕹️ 2. メインレイアウト */
        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .board-center-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f141d;
            position: relative;
        }
        .grid-mock {
            width: 320px;
            height: 320px;
            background: #182232;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            padding: 8px;
        }
        .grid-cell { background: #2c3e50; border-radius: 4px; }
        .grid-cell.hq { background: #1abc9c; }

        /* 📊 3. 右サイドバー (パーティション解除) */
        .right-sidebar-master {
            width: 260px;
            background: #121620;
            border-left: 1.5px solid #1e2538;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .reserve-section {
            padding: 8px;
        }
        .reserve-title {
            font-size: 13.5px;
            font-weight: bold;
            color: #1abc9c;
            margin-bottom: 12px;
        }

        /* 🃏 4. 右下隅: 統合操作パネル (ターン表示 ＋ マリガン ＋ TURN END) */
        .sidebar-bottom-controls-partition {
            background: rgba(24, 34, 50, 0.95);
            border: 1.5px solid #2c3e50;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }

        .turn-box-inside {
            background: rgba(26, 188, 156, 0.15);
            border: 1.5px solid #1abc9c;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
        }
        .turn-label {
            font-size: 10.5px;
            font-weight: bold;
            color: #1abc9c;
            letter-spacing: 1px;
        }
        .turn-val {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
        }

        .btn-action {
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 13.5px;
        }
        .btn-mulligan { background: #e74c3c; color: #ffffff; }
        .btn-turnend { background: #1abc9c; color: #0b0e14; font-size: 14px; font-weight: 900; }
    </style>
</head>
<body>

    <!-- 👑 最上部ヘッダーバー -->
    <div class="header-bar-master">
        <!-- 左: タイトル ＆ ログボタン -->
        <div class="header-left-box">
            <div class="app-title">
                Trial of Ages : Last Ember
                <span style="background:#1abc9c; color:#0b0e14; font-size:11px; padding:2px 6px; border-radius:4px;">ロール 👤</span>
            </div>
            <button class="btn-log-toggle-header">📜 ログ ▽</button>
        </div>

        <!-- 🔥 画面真中央: 目立つサイズでセンタリング -->
        <div class="ember-center-box-master" id="emberCenterBoxMaster">
            <span style="font-size:44px;">🔥</span>
            <span>: 20</span>
        </div>

        <!-- 📊 右端: 各種データ表示パネル (右寄せ ＆ 拡大表示) -->
        <div class="header-data-panel-master" id="headerDataPanelMaster">
            <div class="data-item-master">
                <span style="font-size:18px;">🌾</span>
                <span class="label">食料:</span>
                <span class="val">30</span>
                <span class="prod">(+10/T)</span>
            </div>
            <div class="divider-master"></div>
            <div class="data-item-master">
                <span style="font-size:18px;">🧱</span>
                <span class="label">資材:</span>
                <span class="val">30</span>
                <span class="prod">(+10/T)</span>
            </div>
            <div class="divider-master"></div>
            <div class="data-item-master">
                <span style="font-size:18px;">🛡️</span>
                <span class="label">防衛:</span>
                <span class="val">10</span>
            </div>
            <div class="divider-master"></div>
            <div class="data-item-master">
                <span style="font-size:18px;">✨</span>
                <span class="label">神秘:</span>
                <span class="val">0</span>
                <span class="prod">(+1/T)</span>
            </div>
        </div>
    </div>

    <!-- 🕹️ メインコンテナ -->
    <div class="main-layout">
        <!-- 中央: メインエリア 土地グリッド -->
        <div class="board-center-area">
            <div class="grid-mock">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell hq"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
        </div>

        <!-- 📊 右サイドバー (パーティション解除) -->
        <div class="right-sidebar-master">
            <div class="reserve-section">
                <div class="reserve-title">📥 保留エリア (0/3)</div>
                <div style="font-size:11px; color:#7f8c8d; text-align:center; padding:20px; border:1px dashed #2c3e50; border-radius:8px;">空枠 1</div>
            </div>

            <!-- 🃏 右下隅: 統合操作パネル (ターン表示 ＋ マリガン ＋ TURN END) -->
            <div class="sidebar-bottom-controls-partition">
                <div class="turn-box-inside">
                    <div class="turn-label">⌛ ターン表示</div>
                    <div class="turn-val">1 <span style="font-size:12px; color:#a4b0be; font-weight:normal;">/ 50</span></div>
                </div>
                <button class="btn-action btn-mulligan">力尽きる前に行動: 🔥 -1</button>
                <button class="btn-action btn-turnend">TURN END ➔</button>
            </div>
        </div>
    </div>

</body>
</html>
