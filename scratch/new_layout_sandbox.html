<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>New Layout - Title Under Log Area Sandbox</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0e14;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 👑 ヘッダーバー */
        .header-bar {
            height: 56px;
            background: #121620;
            border-bottom: 1px solid #1e2538;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: relative;
            z-index: 1000;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .app-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* 📜 タイトル直下のログトグルボタン ＆ ドロップダウンパネル */
        .btn-log-toggle-header {
            margin-top: 2px;
            background: rgba(42, 46, 61, 0.8);
            color: #1abc9c;
            border: 1px solid #2c3e50;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
            transition: all 0.2s ease;
        }
        .btn-log-toggle-header:hover {
            background: #1abc9c;
            color: #0b0e14;
        }

        .log-dropdown-panel {
            position: absolute;
            top: 52px;
            left: 0;
            width: 340px;
            max-height: 240px;
            background: rgba(18, 22, 32, 0.96);
            border: 1px solid #2a2e3d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border-radius: 8px;
            display: none; /* デフォルト格納 */
            flex-direction: column;
            z-index: 20000;
            backdrop-filter: blur(8px);
            overflow: hidden;
        }
        .log-dropdown-header {
            background: #161a24;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            color: #1abc9c;
            border-bottom: 1px solid #2a2e3d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .log-dropdown-content {
            padding: 8px;
            overflow-y: auto;
            max-height: 200px;
            font-size: 11px;
            color: #dcdde1;
        }
        .log-item {
            padding: 4px 6px;
            border-bottom: 1px solid #1e2538;
            line-height: 1.4;
        }

        /* 🕹️ メインコンテナ */
        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .board-center-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f141d;
            position: relative;
        }

        .grid-mock {
            width: 320px;
            height: 320px;
            background: #182232;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            padding: 8px;
        }
        .grid-cell {
            background: #2c3e50;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .grid-cell.hq { background: #1abc9c; color: #111; font-weight: bold; }

        /* 📊 右サイドバー */
        .right-sidebar {
            width: 240px;
            background: #121620;
            border-left: 1px solid #1e2538;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-card {
            background: #182232;
            border: 1px solid #2a2e3d;
            border-radius: 8px;
            padding: 12px;
        }
        .sidebar-title {
            font-size: 12px;
            font-weight: bold;
            color: #1abc9c;
            margin-bottom: 8px;
            border-bottom: 1px solid #2a2e3d;
            padding-bottom: 4px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .action-btns {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-action {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-mulligan { background: #e74c3c; color: white; }
        .btn-turnend { background: #1abc9c; color: #0b0e14; }
    </style>
</head>
<body>

    <!-- 👑 ヘッダー -->
    <div class="header-bar">
        <div class="header-left">
            <div class="app-title">Trial of Ages : Last Ember</div>
            <!-- 📜 タイトル直下のログトグルボタン -->
            <button class="btn-log-toggle-header" id="btnLogToggle" onclick="toggleLogDropdown()">
                📜 ログ <span id="logArrow">▽</span>
            </button>
            <!-- 📜 ログドロップダウンパネル (デフォルト格納) -->
            <div class="log-dropdown-panel" id="logDropdownPanel">
                <div class="log-dropdown-header">
                    <span>📜 システムログ一覧</span>
                    <span style="cursor:pointer;" onclick="toggleLogDropdown()">✕</span>
                </div>
                <div class="log-dropdown-content" id="logContent">
                    <div class="log-item">[T1] ゲーム開始: 5x5 盤面が初期化されました。</div>
                    <div class="log-item">[T1] 土地配置: (C3) 本営を初期配置。</div>
                </div>
            </div>
        </div>

        <div style="font-size: 14px; font-weight: bold; color: #f1c40f;">🔥 : 20</div>
        <div style="font-size: 13px; color: #1abc9c; font-weight: bold;">ターン表示 1/50</div>
    </div>

    <!-- 🕹️ メインレイアウト -->
    <div class="main-layout">
        <!-- 盤面中央 -->
        <div class="board-center-area">
            <div class="grid-mock">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell hq">本営</div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
        </div>

        <!-- 📊 右サイドバー (ログ除去後) -->
        <div class="right-sidebar">
            <div class="sidebar-card">
                <div class="sidebar-title">📊 産出データ</div>
                <div class="data-row"><span>🌾 食料</span><span>30 (+10/T)</span></div>
                <div class="data-row"><span>🧱 資材</span><span>30 (+10/T)</span></div>
                <div class="data-row"><span>🛡️ 防衛</span><span>10</span></div>
                <div class="data-row"><span>✨ 神秘</span><span>0 (+1/T)</span></div>
            </div>

            <div class="sidebar-card">
                <div class="sidebar-title">📥 保留エリア (0/3)</div>
                <div style="font-size:11px; color:#7f8c8d; text-align:center; padding:10px;">空枠</div>
            </div>

            <div class="action-btns">
                <button class="btn-action btn-mulligan">マリガン: 🔥-1</button>
                <button class="btn-action btn-turnend">TURN END ➔</button>
            </div>
        </div>
    </div>

    <script>
        function toggleLogDropdown() {
            const panel = document.getElementById("logDropdownPanel");
            const arrow = document.getElementById("logArrow");
            if (panel.style.display === "flex") {
                panel.style.display = "none";
                arrow.innerText = "▽";
            } else {
                panel.style.display = "flex";
                arrow.innerText = "△";
            }
        }
    </script>
</body>
</html>
