name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - "AGtest*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate build identity
        env:
          TOA_BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = {
              "mode": "development",
              "branchName": os.environ["TOA_BRANCH_NAME"],
          }
          Path("game/__toa_build_identity__.json").write_text(
              json.dumps(identity, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: game

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
