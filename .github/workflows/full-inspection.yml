name: AoT Full Inspection

on:
  pull_request:
    branches:
      - "AoT*"

permissions:
  contents: read

concurrency:
  group: full-inspection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  full-inspection:
    name: Full Inspection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR merge result
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate TASK branch contract
        shell: bash
        env:
          AOT_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          AOT_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          node --input-type=module <<'NODE'
          import { expectedTaskBranchPattern, isCanonicalTaskBranch } from './scratch/task_branch_contract.mjs';

          const head = process.env.AOT_HEAD_BRANCH;
          const base = process.env.AOT_BASE_BRANCH;
          if (!isCanonicalTaskBranch(head, base)) {
            console.error(`Invalid TASK branch '${head}'.`);
            console.error(`Expected: ${expectedTaskBranchPattern(base)}`);
            process.exit(1);
          }
          console.log(`TASK branch contract OK: ${head}`);
          NODE

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare AoT PR inspection state
        shell: bash
        env:
          AOT_REPOSITORY: ${{ github.repository }}
          AOT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          AOT_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          AOT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AOT_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          AOT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "${AOT_HEAD_REPOSITORY}" != "${AOT_REPOSITORY}" ]; then
            echo "AoT Full Inspection currently requires a same-repository TASK branch."
            exit 1
          fi

          MERGE_SHA="$(git rev-parse HEAD)"

          git fetch --no-tags origin \
            "+refs/heads/${AOT_HEAD_BRANCH}:refs/remotes/origin/${AOT_HEAD_BRANCH}" \
            "+refs/heads/${AOT_BASE_BRANCH}:refs/remotes/origin/${AOT_BASE_BRANCH}"

          git merge-base --is-ancestor "${AOT_BASE_SHA}" "${MERGE_SHA}"
          git merge-base --is-ancestor "${AOT_HEAD_SHA}" "${MERGE_SHA}"

          git switch -C "${AOT_HEAD_BRANCH}" "${MERGE_SHA}"
          git branch --set-upstream-to="origin/${AOT_HEAD_BRANCH}" "${AOT_HEAD_BRANCH}"

          git config --local aot.authorizedBranch "${AOT_HEAD_BRANCH}"
          git config --local aot.workMode DIRECT
          git config --local --unset-all aot.authorizedWorkBranch || true
          git config --local --unset-all aot.authorizedTaskBranch || true
          git config --local --unset-all aot.authorizedBaseCommit || true

          git reset --mixed "${AOT_BASE_SHA}"

          test "$(git rev-parse --abbrev-ref HEAD)" = "${AOT_HEAD_BRANCH}"
          test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" = "origin/${AOT_HEAD_BRANCH}"

          echo "PR merge result prepared as working-tree diff against ${AOT_BASE_SHA}."
          git status --short

      - name: Run Task Sweeper safety contract
        run: node scratch/test_task_sweeper.mjs

      - name: Run Trial runtime focused tests
        run: |
          node game/src/trial/dev/diagnose_warning_timing_bridge.mjs
          node game/src/trial/dev/diagnose_trial_due_state_service.mjs
          node game/src/trial/dev/diagnose_trial_launch_coordinator.mjs
          node game/src/trial/dev/diagnose_trial_launch_bootstrap.mjs
          node game/src/trial/dev/diagnose_trial_launch_trigger_order.mjs
          node game/src/trial/dev/diagnose_trial_stage_progression_service.mjs
          node scratch/test_trial_route_visual_semantics.mjs

      - name: Run Warning focused tests
        run: |
          node scratch/test_warning_state_fact_bridge.mjs

      - name: Run Advisor dialogue focused tests
        run: |
          node scratch/test_advisor_character_contract.mjs
          node scratch/test_advisor_character_dialogue_override.mjs
          node scratch/test_advisor_character_differentiation.mjs
          node scratch/test_advisor_character_voice_contrast.mjs
          node scratch/test_advisor_reaction_dialogue_integration.mjs
          node scratch/test_advisor_staff_officer_golden_lines.mjs
          node scratch/test_advisor_staff_officer_reaction_boundaries.mjs
          node scratch/test_advisor_reaction_scene_coverage.mjs

      - name: Run AoT Full Inspection
        run: node scratch/run_full_inspection.mjs
